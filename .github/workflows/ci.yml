# Continuous integration: every push and pull request must pass all checks.
#
# - verify: typecheck, lint, build, unit/API tests and browser tests, on every push and pull request.
# - lessons: executed lessons and local labs, in three parallel shards. On pushes and pull requests only the
#   lessons a change can affect run (scripts/lib/affected.ts); the nightly run and manual runs execute all of
#   them. A lesson counts as "executed" only after a CI run that actually ran it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 1 * * *" # nightly, 01:30 UTC: the full suite
  workflow_dispatch: # manual run: the full suite (run before marking a milestone done and before tagging)

permissions:
  contents: read

# Pull requests cancel superseded runs; pushes to main queue instead. Lesson selection compares with the last
# fully successful run on main, so a cancelled or skipped run never leaves a change unverified.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck server, shared code and scripts
        run: npm run typecheck
      - name: Typecheck frontend (React)
        run: npm run typecheck:web
      - name: Lint documentation
        run: npm run lint:md
      - name: Validate content and build
        run: npm run build
      - name: Unit and integration tests
        # Executed lessons and labs run in the "lessons" job below, in parallel shards.
        env:
          DEVFORGE_LESSON_SHARD: "off"
        run: npm test
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium (keyed by the exact Playwright version)
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium-ubuntu-24.04
      - name: Install Chromium for end-to-end tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries (browser restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # The runner image lists third-party apt repositories this job does not need; when one of them is
        # unavailable (packages.microsoft.com answered 403 in run 45988691485), apt-get update fails the step.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          npx playwright install-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: build/screenshots
          retention-days: 7

  lessons:
    permissions:
      contents: read
      actions: read   # to find the last successful run on main
    # Every command in every selected lesson and local lab runs against the real tool, and its output is
    # compared with the lesson. Lessons replay their own prerequisites, so the shards are independent.
    name: Executed lessons (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # A real PostgreSQL server so SQL lessons' commands run and their output is checked.
    # Version 16 matches the psql client shipped by Ubuntu 24.04.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEVFORGE_LESSON_SHARD: "${{ matrix.shard }}/3"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: devforge
      # Allows Redis lessons to empty the throwaway CI Redis before each run. Never set this against real data.
      DEVFORGE_REDIS_TEST: "1"
      # Allows Docker lessons to create and force-remove containers/volumes on this disposable runner.
      DEVFORGE_DOCKER_TEST: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Which files changed since main last passed (pushes), or against the base (pull requests)
        env:
          EVENT: ${{ github.event_name }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest commit on main whose CI run succeeded in full; changes since then are tested.
          LAST_GREEN=""
          if [ "$EVENT" = push ]; then
            LAST_GREEN=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 20 \
              --json headSha -q '.[].headSha' | while read -r sha; do
                git merge-base --is-ancestor "$sha" "$AFTER" 2> /dev/null && { echo "$sha"; break; }; done || true)
          fi
          if [ "$EVENT" = push ] && [ -n "$LAST_GREEN" ]; then
            echo "comparing with the last fully successful run on main: $LAST_GREEN"
            git diff --name-only "$LAST_GREEN" "$AFTER" > changed.txt
          elif [ "$EVENT" = pull_request ] && [ -n "$BASE" ]; then
            git diff --name-only "$BASE" "$AFTER" > changed.txt
          else
            echo all > changed.txt
          fi
          echo "changed files:"; cat changed.txt
          { echo 'DEVFORGE_CHANGED_FILES<<DEVFORGE_EOF'; cat changed.txt; echo 'DEVFORGE_EOF'; } >> "$GITHUB_ENV"
      - name: Select this shard's lessons
        id: select
        run: node --disable-warning=ExperimentalWarning scripts/affected-lessons.ts
      - name: Install lesson tools
        if: steps.select.outputs.count != '0'
        uses: ./.github/actions/lesson-tools
      - name: Executed lessons and labs
        if: steps.select.outputs.count != '0'
        run: node --disable-warning=ExperimentalWarning --test scripts/lib/lesson-runner.test.ts
      - name: Mini-project checks that need Docker (the verify job runs the others)
        run: node --disable-warning=ExperimentalWarning --test scripts/lib/projects.test.ts
      - name: Save Terraform provider and npm caches
        if: always() && steps.select.outputs.count != '0'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/devforge-terraform-plugins
            ~/.cache/devforge-npm
          key: lesson-pkg-caches-${{ hashFiles('content/lessons/terraform/**', 'content/labs/terraform/**', 'content/lessons/postman/**', 'content/labs/postman/**', 'content/lessons/opentelemetry/**') }}-shard${{ matrix.shard }}
