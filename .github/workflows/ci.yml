# Continuous integration: every push and pull request must pass all checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # A real PostgreSQL server so SQL lessons' commands run and their output is checked.
    # Version 16 matches the psql client shipped by Ubuntu 24.04.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: devforge
      # Allows Redis lessons to empty the throwaway CI Redis before each run. Never set this against real data.
      DEVFORGE_REDIS_TEST: "1"
      # Allows Docker lessons to create and force-remove containers/volumes on this disposable runner.
      DEVFORGE_DOCKER_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      # No lockfile is committed yet (see IMPLEMENTATION_STATUS.md); switch to `npm ci` once package-lock.json exists.
      - run: npm install --no-audit --no-fund
      - name: Install lesson tools (psql, createdb, dropdb, redis-cli, nginx)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client redis-tools nginx
      - name: Install Terraform (pinned and checksum-verified)
        env:
          TF_VERSION: "1.15.6"
        run: |
          cd "$RUNNER_TEMP"
          base="https://releases.hashicorp.com/terraform/${TF_VERSION}"
          curl -fsSLO "${base}/terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLO "${base}/terraform_${TF_VERSION}_SHA256SUMS"
          grep " terraform_${TF_VERSION}_linux_amd64.zip$" "terraform_${TF_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -o -q "terraform_${TF_VERSION}_linux_amd64.zip" terraform -d tfbin
          sudo install -m 0755 tfbin/terraform /usr/local/bin/terraform
          terraform version
      - name: Install kind and kubectl (pinned and checksum-verified)
        env:
          KIND_VERSION: "v0.32.0"
          KUBECTL_VERSION: "v1.36.1"
        run: |
          cd "$RUNNER_TEMP"
          kind_base="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          curl -fsSLo kind "${kind_base}/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "${kind_base}/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256sum)  kind" | sha256sum -c -
          k8s_base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64"
          curl -fsSLO "${k8s_base}/kubectl"
          curl -fsSLO "${k8s_base}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          sudo install -m 0755 kind kubectl /usr/local/bin/
          kind version
          kubectl version --client
      - name: Install Prometheus and Grafana (pinned and checksum-verified)
        env:
          PROMETHEUS_VERSION: "3.16.0"
          GRAFANA_VERSION: "13.3.2"
        run: |
          cd "$RUNNER_TEMP"
          p="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          curl -fsSLO "${base}/${p}.tar.gz"
          curl -fsSLO "${base}/sha256sums.txt"
          grep " ${p}.tar.gz$" sha256sums.txt | sha256sum -c -
          tar -xzf "${p}.tar.gz"
          sudo install -m 0755 "${p}/prometheus" "${p}/promtool" /usr/local/bin/
          prometheus --version | head -n 1
          # Grafana publishes the checksum alone in a .sha256 file.
          g="grafana-${GRAFANA_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "https://dl.grafana.com/oss/release/${g}"
          curl -fsSLO "https://dl.grafana.com/oss/release/${g}.sha256"
          echo "$(cat "${g}.sha256")  ${g}" | sha256sum -c -
          tar -xzf "${g}"
          echo "GRAFANA_HOME=$RUNNER_TEMP/grafana-${GRAFANA_VERSION}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/grafana-${GRAFANA_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/grafana-${GRAFANA_VERSION}/bin/grafana" --version
      - name: Typecheck server, shared code and scripts
        run: npm run typecheck
      - name: Typecheck frontend (React)
        run: npm run typecheck:web
      - name: Lint documentation
        run: npm run lint:md
      - name: Validate content and build
        run: npm run build
      - name: Unit and integration tests
        run: npm test
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: build/screenshots
          retention-days: 7
