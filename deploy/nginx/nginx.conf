# Reverse proxy for DevForge 18 (see docs/deployment.md).
upstream devforge_app {
  server app:8080;
  keepalive 16;
}

# Coarse per-IP limit at the edge. Generous: a whole classroom may share one address. 100 r/s (6,000 a minute)
# matches the app's default API_RATE_LIMIT_PER_IP_PER_MINUTE; keep it at least that value / 60 when you raise the
# app limit (docs/deployment.md, "Rate limits"). The app's per-user limit is the finer abuse guard.
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
# Answer over-limit requests with 429 Too Many Requests (the default, 503, reads as an outage to clients and monitors).
limit_req_status 429;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 128k;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Metrics are for the internal Prometheus scraper only.
  location = /metrics { return 404; }

  location /api/ {
    limit_req zone=api burst=200 nodelay;
    proxy_pass http://devforge_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://devforge_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
