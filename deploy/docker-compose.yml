# Local production-like stack: Nginx in front of the DevForge app.
#   cd deploy && docker compose up --build
# Then open http://localhost:8080
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"          # the client IP comes from Nginx's X-Forwarded-For
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set to true when Nginx terminates HTTPS
    volumes:
      - devforge-data:/data
    expose:
      - "8080"                      # reachable only from the Compose network, not the host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  devforge-data:
