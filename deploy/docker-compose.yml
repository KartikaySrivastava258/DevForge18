# Local production-like stack: Nginx in front of the DevForge app.
#   cd deploy && docker compose up --build
# Then open http://localhost:8080 (or set DEVFORGE_HTTP_PORT and PUBLIC_ORIGIN together to use another port).
# Tested in CI by scripts/compose-smoke.sh (build, start, smoke test through Nginx).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"          # the client IP comes from Nginx's X-Forwarded-For
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set to true when Nginx terminates HTTPS
      # API rate limits (docs/deployment.md, "Rate limits"); keep Nginx's limit_req rate >= the per-address value / 60.
      API_RATE_LIMIT_PER_IP_PER_MINUTE: ${API_RATE_LIMIT_PER_IP_PER_MINUTE:-6000}
      API_RATE_LIMIT_PER_USER_PER_MINUTE: ${API_RATE_LIMIT_PER_USER_PER_MINUTE:-600}
    volumes:
      - devforge-data:/data
    expose:
      - "8080"                      # reachable only from the Compose network, not the host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  nginx:
    # Stable branch, pinned by version and multi-arch index digest; pushed to Docker Hub 2026-11-13.
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${DEVFORGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs:                          # the only paths Nginx writes: temp files and its PID file
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  devforge-data:
