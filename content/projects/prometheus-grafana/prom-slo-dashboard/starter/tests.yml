rule_files: [rules.yml]
evaluation_interval: 1m
tests:
  - name: 10% of requests fail
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="campus-api", code="200"}'
        values: '0+900x120'
      - series: 'http_requests_total{job="campus-api", code="500"}'
        values: '0+100x120'
    alert_rule_test:
      - alertname: AvailabilityFastBurn
        eval_time: 1h
        exp_alerts:
          - exp_labels: { severity: page, job: campus-api }
