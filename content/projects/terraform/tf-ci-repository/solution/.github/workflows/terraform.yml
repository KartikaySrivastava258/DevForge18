name: terraform

# Every pull request that touches the infrastructure is formatted, validated, tested and planned.
# Nothing is applied from here: applying needs a remote backend and an approval step (see the CI lesson).
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

# Read-only token: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      # Actions pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false
      - name: Formatting
        run: terraform fmt -check -recursive
        working-directory: .
      - name: Init with the committed lock file (fails if it is missing or out of date)
        run: terraform init -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform test -no-color
      - name: Plan for staging, and summarise it for reviewers
        run: |
          code=0
          terraform plan -input=false -no-color -detailed-exitcode -var environment=staging -out=tfplan > plan.txt || code=$?
          cat plan.txt
          # 0 = no changes, 2 = changes (fine for a plan), 1 = error.
          if [ "$code" -eq 1 ]; then exit 1; fi
          {
            echo "### Terraform plan (staging)"
            echo '```'
            grep -E '^  # |^Plan:|^No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
