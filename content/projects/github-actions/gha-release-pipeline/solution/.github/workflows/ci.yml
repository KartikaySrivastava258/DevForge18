name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    uses: ./.github/workflows/test.yml
    with:
      node-version: ${{ matrix.node-version }}
