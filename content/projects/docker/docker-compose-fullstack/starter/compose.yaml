# Campus Noticeboard — first draft. It starts on the author's laptop; README.md lists what it must do instead.
services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/site:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./api
    environment:
      REDIS_HOST: redis
    ports:
      - "3000:3000"   # handy for debugging
    depends_on:
      - redis

  redis:
    image: redis:latest
    ports:
      - "6379:6379"   # handy for debugging
