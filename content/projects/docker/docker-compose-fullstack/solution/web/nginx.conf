# The web service: serves the page in web/site and forwards /api/ to the api service by its Compose name.
# Mounted over /etc/nginx/conf.d/default.conf in the official nginx image.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
