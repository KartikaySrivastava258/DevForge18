# The whole lab: docker compose up, then open http://localhost:8080/report?class=CS-A and Jaeger on :16686.
services:
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports: ["127.0.0.1:16686:16686"]
  collector:
    image: otel/opentelemetry-collector:0.165.0
    command: ["--config=/cfg.yaml"]
    volumes: ["./otel-collector.yaml:/cfg.yaml:ro"]
    depends_on: [jaeger]
  grades:
    image: node:22.23.4-bookworm-slim
    working_dir: /app
    volumes: [".:/app"]
    command: ["npm", "run", "start:grades"]
    environment: { OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4318" }
  report:
    image: node:22.23.4-bookworm-slim
    working_dir: /app
    volumes: [".:/app"]
    command: ["npm", "run", "start:report"]
    environment: { OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4318", GRADES_URL: "http://grades:8082" }
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [grades, collector]
