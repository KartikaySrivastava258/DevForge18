# The timetable web tier. It works — until a release goes wrong.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: { app: timetable }
  template:
    metadata:
      labels: { app: timetable }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: timetable }
  ports:
    - port: 80
      targetPort: 80
