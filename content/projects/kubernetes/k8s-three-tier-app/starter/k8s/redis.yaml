# Database tier — complete. Use it as the pattern for the other two tiers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: campus
  labels: { app: campus, tier: database }
spec:
  replicas: 1
  selector:
    matchLabels: { app: campus, tier: database }
  template:
    metadata:
      labels: { app: campus, tier: database }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: campus
spec:
  type: ClusterIP
  selector: { app: campus, tier: database }
  ports:
    - port: 6379
      targetPort: 6379
