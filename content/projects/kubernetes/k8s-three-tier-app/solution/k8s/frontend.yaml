# Frontend tier: nginx serves the page and passes /api/ on to the api Service. Do not change this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-files
  namespace: campus
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      # /api/visits -> http://api:8080/cgi-bin/visits ("api" is the Service name in this namespace)
      location /api/ {
        proxy_pass http://api:8080/cgi-bin/;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>Campus notice board</title></head>
    <body>
      <h1>Campus notice board</h1>
      <p>Visits so far: <span id="visits">…</span></p>
      <script>
        fetch("/api/visits").then((r) => r.json()).then((d) => { document.getElementById("visits").textContent = d.visits; });
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: campus
  labels: { app: campus, tier: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: campus, tier: frontend }
  template:
    metadata:
      labels: { app: campus, tier: frontend }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - containerPort: 80
          volumeMounts:
            # subPath mounts one key as one file and leaves the rest of each directory as the image has it.
            - name: files
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: files
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: files
          configMap:
            name: frontend-files
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: campus
spec:
  type: ClusterIP   # reach it with kubectl port-forward; an Ingress or Gateway would expose it for real
  selector: { app: campus, tier: frontend }
  ports:
    - port: 80
      targetPort: 80
