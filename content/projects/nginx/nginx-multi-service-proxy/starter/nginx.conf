# Campus Hub — one public entry point (port 80) in front of four services.
# Run it with `docker compose up` (see compose.yaml) and test with curl, for example:
#   curl -H "Host: campus.example" http://127.0.0.1:8080/api/courses/42
# The README describes what this file must do. Test every change with:
#   docker compose exec proxy nginx -t && docker compose exec proxy nginx -s reload

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;

    # First draft: everything goes to the frontend, for every host name.
    # TODO: route the API paths, add the admin host, refuse unknown hosts, pass the client's details on,
    #       and stop announcing the Nginx version.
    server {
        listen 80;

        location / {
            proxy_pass http://web:8000;
        }
    }
}
