# Campus Hub — one public entry point (port 80) in front of four services.
# Run it with `docker compose up` (see compose.yaml) and test with curl, for example:
#   curl -H "Host: campus.example" http://127.0.0.1:8080/api/courses/42

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;

    # Do not announce the Nginx version in the Server header and on error pages.
    server_tokens off;

    # Every service listens on port 8000 and is reached by its Compose service name.
    upstream web     { server web:8000; }
    upstream courses { server courses:8000; }
    upstream notices { server notices:8000; }
    upstream admin   { server admin:8000; }

    # Tell the services who really asked. Set once here, inherited by every location that proxies.
    # (Inheritance stops at any level that sets its own proxy_set_header — then repeat all of them there.)
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Requests for any other host name (or none) end here: without this block, the first server below would
    # become the default and answer them, sending stray traffic to the application.
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 80;
        server_name campus.example;

        # Everything that is not the API is the frontend.
        location / {
            proxy_pass http://web;
        }

        # proxy_pass without a path after the upstream name passes the request URI on unchanged:
        # /api/courses/42?term=2 arrives at the courses service as /api/courses/42?term=2.
        location /api/courses/ {
            proxy_pass http://courses;
        }

        location /api/notices/ {
            proxy_pass http://notices;
        }

        # Any other /api/ path is a mistake: answer it here instead of sending it to the frontend.
        # (Longest prefix wins, so /api/courses/ and /api/notices/ still take their own requests.)
        location /api/ {
            return 404;
        }
    }

    server {
        listen 80;
        server_name admin.campus.example;

        location / {
            proxy_pass http://admin;
        }
    }
}
