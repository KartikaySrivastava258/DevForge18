# Campus Store — one Nginx serves the built single-page app from site/ and acts as a small API gateway in front
# of the users and orders services.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # Text compresses well; images and fonts are already compressed. (text/html is always included.)
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;
    gzip_vary on;

    # 10 API requests per second per client address, tracked in 1 MB of shared memory.
    limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;

    upstream users  { server users:8000; }
    upstream orders { server orders:8000; }

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Applies to every location below that has no add_header of its own.
        include /etc/nginx/snippets/security-headers.conf;

        # --- The single-page app -----------------------------------------------------------------------
        # Any path that is not a file is a page of the app: hand the browser index.html and let the
        # app's router show /orders/42. (Without this, reloading a deep link gives 404.)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html names the current asset files, so browsers must check it on every visit.
        # "/" and the fallback above both end up here through an internal redirect.
        location = /index.html {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.conf;   # own add_header: repeat the shared ones
        }

        # Fingerprinted assets (app.<hash>.js) never change under the same name: cache them for a year.
        # A missing asset is a 404 — never index.html, which a browser would try to run as a script.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/snippets/security-headers.conf;
        }

        # --- The API gateway ---------------------------------------------------------------------------
        # proxy_pass with a path replaces the matched location prefix: /api/v1/users/42 -> /users/42.
        location /api/v1/users/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 100k;
            proxy_pass http://users/users/;
        }

        # Avatars are the one upload that may be large.
        location = /api/v1/users/avatar {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 5m;
            proxy_pass http://users/users/avatar;
        }

        location /api/v1/orders/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 100k;
            proxy_pass http://orders/orders/;
        }

        # Every other API path: a JSON 404 from Nginx, so API clients never receive index.html.
        location /api/ {
            default_type application/json;
            return 404 '{"error":"not found"}\n';
        }
    }
}
