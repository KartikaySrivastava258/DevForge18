# Campus Store on your machine: two stand-in API services and Nginx serving site/ in front of them.
#   docker compose up -d        start everything (open http://127.0.0.1:8080; PROXY_PORT=8081 to change)
#   docker compose exec proxy nginx -t && docker compose exec proxy nginx -s reload   after editing nginx.conf
#   docker compose down         stop and remove everything
# Images are pinned by digest, as the check uses them: Nginx 1.24.0 (the lessons' version) and Node.js 22.
x-service: &service
  image: node:22.23.5-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
  command: ["node", "/srv/echo.js"]
  volumes:
    - ./services/echo.js:/srv/echo.js:ro

services:
  users:
    <<: *service
    environment: { NAME: users }
  orders:
    <<: *service
    environment: { NAME: orders }
  proxy:
    image: nginx:1.24.0-alpine@sha256:77e5d4a6ad906c5d3793764085706577fa705b1dc6f244ea0241c4b5e2155385
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - ./snippets:/etc/nginx/snippets:ro
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:80"
    depends_on: [users, orders]
