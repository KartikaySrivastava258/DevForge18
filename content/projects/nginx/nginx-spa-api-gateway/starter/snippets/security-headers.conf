# Security headers for every response, errors included ("always").
# Remember the add_header rule from the Nginx lab: a level that has its own add_header inherits NONE from the
# levels above, so include this file again in every location that adds a header of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
