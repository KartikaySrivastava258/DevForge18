# Campus Store — one Nginx serves the built single-page app from site/ and acts as a small API gateway in front
# of the users and orders services. The README describes what this file must do. Test every change with:
#   docker compose exec proxy nginx -t && docker compose exec proxy nginx -s reload
# compose.yaml mounts site/ at /usr/share/nginx/html and snippets/ at /etc/nginx/snippets (the check does the same).

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;

    # First draft: static files from site/, and the whole API sent to the users service.
    # TODO: everything in the README.
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            proxy_pass http://users:8000;
        }
    }
}
