# Canteen ordering API — Nginx spreads requests across three instances, steers long reports to the least busy
# report server, hides crashed or maintenance instances from users, and falls back to a maintenance service
# when every instance is down.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    upstream api {
        # Shared memory: every worker process sees the same round-robin position and the same failure
        # state. Without a zone each worker balances (and counts failures) on its own.
        zone api 64k;
        # Default method: round robin. max_fails=1 fail_timeout=10s are the defaults — one failed attempt
        # takes an instance out of rotation for 10 seconds, so users do not keep paying for it.
        server app1:8000;
        server app2:8000;
        server app3:8000;
        # Only used when every server above is unavailable.
        server fallback:8000 backup;
    }

    upstream reports {
        zone reports 64k;
        # Reports take seconds, not milliseconds: send each new request to the instance with the fewest
        # active connections instead of strictly taking turns.
        least_conn;
        server r1:8000;
        server r2:8000;
    }

    server {
        listen 80;

        # A refused connection is detected at once; this bounds the wait for an instance that does not
        # answer at all (the default is 60 s).
        proxy_connect_timeout 2s;

        location /api/ {
            proxy_pass http://api;
            # Default is "error timeout". Adding http_503 lets a GET that meets an instance in maintenance
            # be tried on the next one. POST, PATCH and LOCK requests are still never sent a second time,
            # because "non_idempotent" is not listed: an order must not be placed twice.
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /reports/ {
            proxy_pass http://reports;
            proxy_read_timeout 30s;
        }
    }
}
