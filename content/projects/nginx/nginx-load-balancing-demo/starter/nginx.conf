# Canteen ordering API — Nginx in front of several instances of the API and of the report service.
# The README describes what this file must do. Test every change with:
#   docker compose exec proxy nginx -t && docker compose exec proxy nginx -s reload

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # First draft from before the scale-up. TODO: app3, the fallback service, r2, and the rules in the README.
    upstream api {
        server app1:8000;
        server app2:8000;
    }

    upstream reports {
        server r1:8000;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api;
        }

        location /reports/ {
            proxy_pass http://reports;
        }
    }
}
