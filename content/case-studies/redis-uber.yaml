# Every quote was checked word for word against the source page on 2026-11-26.
id: redis-uber
organisation: Uber
tracks:
- redis
summary: Uber built CacheFront, a Redis-backed cache inside its Docstore database layer, to replace per-team caching.
  Because a cache can lag the database, use is opt-in per database, table or request.
claims:
- text: Uber offers Redis to its teams as a distributed cache.
  quote: At Uber we provide Redis™ as a distributed caching solution.
  source_url: https://www.uber.com/en-US/blog/how-uber-serves-over-40-million-reads-per-second-using-an-integrated-cache/
  source_title: How Uber Serves Over 40 Million Reads Per Second from Online Storage Using an Integrated Cache
  publisher: Uber Engineering Blog (authors include Preetham Narayanareddy, Eli Pozniansky)
  published: '2024-02-15'
  checked_on: '2026-11-26'
  kind: confirmed
- text: Having each team run its own cache caused duplicated effort, so Uber built caching into its database layer.
  quote: Each team has to provision and maintain their own Redis cache for their respective services
  source_url: https://www.uber.com/en-US/blog/how-uber-serves-over-40-million-reads-per-second-using-an-integrated-cache/
  source_title: How Uber Serves Over 40 Million Reads Per Second from Online Storage Using an Integrated Cache
  publisher: Uber Engineering Blog
  published: '2024-02-15'
  checked_on: '2026-11-26'
  kind: confirmed
- text: Caching was made optional because a cache can be out of date compared with the database.
  quote: For example, cache invalidation may fail or lag behind database writes. For this reason, we made integrated
    caching an opt-in feature.
  source_url: https://www.uber.com/en-US/blog/how-uber-serves-over-40-million-reads-per-second-using-an-integrated-cache/
  source_title: How Uber Serves Over 40 Million Reads Per Second from Online Storage Using an Integrated Cache
  publisher: Uber Engineering Blog
  published: '2024-02-15'
  checked_on: '2026-11-26'
  kind: confirmed
lessons_learned:
- Cache invalidation and consistency are the hard part of caching; strongly consistent flows may need to bypass
  the cache.
- Centralising the cache in one platform team removes duplicated work across product teams.
