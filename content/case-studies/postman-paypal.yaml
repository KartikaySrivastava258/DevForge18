summary: PayPal uses Postman inside the company and publishes a public collection to help outside developers start
  using its APIs. It measures how long it takes a new developer to make a first successful call.
claims:
- text: PayPal publishes a public Postman Collection so outside developers can try its APIs.
  quote: In April 2022, PayPal launched its first Public Postman Collection for developers of all kinds, which has
    seen great success since.
  source_url: https://www.postman.com/customer-stories/paypal/
  source_title: PayPal API Case Study | Postman API Platform
