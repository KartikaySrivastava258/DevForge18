- text: PayPal tracks 'time to first call' as a measure of how easy its APIs are to start using.
  quote: One metric that PayPal continually seeks to decrease is the Time To First Call (TTFC). This is the time
    it takes from signing up to making an API call
  source_url: https://www.postman.com/customer-stories/paypal/
