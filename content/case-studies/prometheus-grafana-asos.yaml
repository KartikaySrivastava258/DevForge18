summary: ASOS began using open-source Grafana to visualise telemetry it already had in Azure, and it spread to become
  the main dashboarding tool. ASOS later moved to the hosted Grafana Cloud to avoid running the platform itself.
claims:
- text: ASOS adopted open-source Grafana to get near real-time visibility of its telemetry.
  quote: the team turned to Grafana OSS in 2017.
  source_url: https://grafana.com/success/asos/
  source_title: 'Reducing MTTR with Grafana Cloud: Inside ASOS'' observability stack'
  publisher: Grafana Labs (vendor case study)
  published: not stated
