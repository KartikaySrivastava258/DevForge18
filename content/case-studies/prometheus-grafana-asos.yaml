lessons_learned:
- Grafana's value comes partly from querying data where it already lives (many data-source plugins), not only from
  Prometheus.
- 'Self-hosting brings maintenance overhead, which is a common reason teams later weigh a managed service (ASOS:
  "focus on the observability — getting the best out of the platform — without running it").'
caveat: Vendor marketing page; it also promotes the paid Grafana Cloud.
