<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270">
  <!-- Hardening what a workflow runs and what it releases, from Supply-chain hardening. -->
  <rect class="f-box-danger" x="10" y="30" width="220" height="80" rx="8"/>
  <text class="f-small f-strong f-mono" x="120" y="54" text-anchor="middle">uses: org/action@v2</text>
  <text class="f-small" x="120" y="78" text-anchor="middle">tag can be moved</text>
  <text class="f-small" x="120" y="98" text-anchor="middle">to other code</text>
  <rect class="f-box-ok" x="10" y="150" width="220" height="80" rx="8"/>
  <text class="f-small f-strong f-mono" x="120" y="174" text-anchor="middle">uses: org/action@&lt;sha&gt;</text>
  <text class="f-small f-mono" x="120" y="198" text-anchor="middle"># v2.1.0</text>
  <text class="f-small" x="120" y="218" text-anchor="middle">exactly one commit</text>
  <rect class="f-box-accent" x="270" y="90" width="190" height="90" rx="8"/>
  <text class="f-small f-strong" x="365" y="114" text-anchor="middle">Dependabot</text>
  <text class="f-small" x="365" y="138" text-anchor="middle">PRs bump SHA</text>
  <text class="f-small" x="365" y="158" text-anchor="middle">and comment together</text>
  <rect class="f-box-warn" x="500" y="90" width="210" height="90" rx="8"/>
  <text class="f-small f-strong f-mono" x="605" y="114" text-anchor="middle">actions/attest</text>
  <text class="f-small" x="605" y="138" text-anchor="middle">signed provenance:</text>
  <text class="f-small" x="605" y="158" text-anchor="middle">workflow, repo, commit</text>
  <g>
    <path class="f-arrow" d="M232 190 L262.6 155.9"/>
    <polygon class="f-head" points="268,150 266.0,159.0 259.3,152.9"/>
  </g>
  <g>
    <path class="f-arrow" d="M462 135 L490 135"/>
    <polygon class="f-head" points="498,135 490,139.5 490,130.5"/>
  </g>
  <text class="f-small f-mono" x="605" y="210" text-anchor="middle">gh attestation verify</text>
  <text class="f-small f-muted" x="360" y="255" text-anchor="middle">lockfiles (gh actions-lock) also pin the actions your actions use</text>
</svg>
