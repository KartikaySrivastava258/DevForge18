<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <!-- Exchanging an OIDC token for temporary credentials, from OIDC — cloud access without long-lived secrets. -->
  <rect class="f-box" x="10" y="40" width="200" height="90" rx="8"/>
  <text class="f-small f-strong" x="110" y="64" text-anchor="middle">job (id-token: write)</text>
  <text class="f-small f-mono" x="110" y="88" text-anchor="middle">environment: production</text>
  <text class="f-small f-ok" x="110" y="110" text-anchor="middle">no stored secret</text>
  <rect class="f-box-accent" x="260" y="20" width="200" height="90" rx="8"/>
  <text class="f-small f-strong" x="360" y="44" text-anchor="middle">GitHub OIDC issuer</text>
  <text class="f-small" x="360" y="68" text-anchor="middle">signed JWT, minutes</text>
  <text class="f-small f-mono" x="360" y="90" text-anchor="middle">sub, aud, iss …</text>
  <rect class="f-box-warn" x="510" y="40" width="200" height="110" rx="8"/>
  <text class="f-small f-strong" x="610" y="64" text-anchor="middle">cloud (AWS STS)</text>
  <text class="f-small" x="610" y="88" text-anchor="middle">1. verify signature</text>
  <text class="f-small" x="610" y="108" text-anchor="middle">2. trust conditions:</text>
  <text class="f-small" x="610" y="128" text-anchor="middle">aud and sub match?</text>
  <rect class="f-box-ok" x="260" y="170" width="200" height="70" rx="8"/>
  <text class="f-small f-strong" x="360" y="194" text-anchor="middle">temporary credentials</text>
  <text class="f-small" x="360" y="216" text-anchor="middle">expire on their own</text>
  <g>
    <path class="f-arrow" d="M212 70 L250.1 63.4"/>
    <polygon class="f-head" points="258,62 250.9,67.8 249.3,58.9"/>
  </g>
  <text class="f-small f-muted" x="235" y="52" text-anchor="middle">1</text>
  <g>
    <path class="f-arrow" d="M212 105 L500 105"/>
    <polygon class="f-head" points="508,105 500,109.5 500,100.5"/>
  </g>
  <text class="f-small f-muted" x="360" y="128" text-anchor="middle">2  token + role-to-assume</text>
  <g>
    <path class="f-arrow" d="M610 152 L469.6 197.5"/>
    <polygon class="f-head" points="462,200 468.2,193.3 471.0,201.8"/>
  </g>
  <g>
    <path class="f-arrow" d="M258 205 L117.2 137.5"/>
    <polygon class="f-head" points="110,134 119.2,133.4 115.3,141.5"/>
  </g>
  <text class="f-small f-mono" x="600" y="262" text-anchor="middle">sub = repo:OWNER/REPO:environment:production</text>
</svg>
