<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <!-- Numbered diagram for the Nginx track quiz: label the parts of a load-balanced setup with a failed server and a backup. -->
  <rect class="f-box-faint" x="20" y="120" width="140" height="80" rx="8"/>
  <text class="f-strong" x="90" y="167" text-anchor="middle">1</text>
  <text class="f-small" x="90" y="222" text-anchor="middle">sends GET /api/menu</text>
  <rect class="f-box-faint" x="250" y="120" width="140" height="80" rx="8"/>
  <text class="f-strong" x="320" y="167" text-anchor="middle">2</text>
  <text class="f-small f-mono" x="320" y="222" text-anchor="middle">upstream api { … }</text>
  <rect class="f-box-faint" x="560" y="20" width="160" height="70" rx="8"/>
  <text class="f-strong" x="640" y="62" text-anchor="middle">3</text>
  <rect class="f-box-faint" x="560" y="125" width="160" height="70" rx="8"/>
  <text class="f-strong" x="640" y="167" text-anchor="middle">4</text>
  <rect class="f-box-faint" x="560" y="230" width="160" height="70" rx="8"/>
  <text class="f-strong" x="640" y="272" text-anchor="middle">5</text>
  <g>
    <path class="f-arrow" d="M162 160 L240 160"/>
    <polygon class="f-head" points="248,160 240,164.5 240,155.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M392 140 L550 62"/>
    <polygon class="f-head" points="557,58 551,66 547,58"/>
  </g>
  <text class="f-small f-mono" x="455" y="82" text-anchor="middle">200 OK</text>
  <g>
    <path class="f-arrow" d="M392 160 L550 160"/>
    <polygon class="f-head" points="558,160 550,164.5 550,155.5"/>
  </g>
  <text class="f-small" x="475" y="150" text-anchor="middle">connection refused,</text>
  <text class="f-small" x="475" y="182" text-anchor="middle">skipped for fail_timeout</text>
  <g>
    <path class="f-arrow" d="M392 180 L550 258"/>
    <polygon class="f-head" points="557,262 547,262 551,254"/>
  </g>
  <text class="f-small" x="440" y="262" text-anchor="middle">only when 3 and 4</text>
  <text class="f-small" x="440" y="278" text-anchor="middle">are unavailable</text>
</svg>
