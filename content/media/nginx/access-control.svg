<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250">
  <!-- Ways Nginx can decide who gets in, from Access control and connection limits. -->
  <rect class="f-box" x="10" y="20" width="168" height="200" rx="8"/>
  <text class="f-small f-strong f-mono" x="94" y="50" text-anchor="middle">allow / deny</text>
  <text class="f-small" x="94" y="96" text-anchor="middle">by IP address or network</text>
  <text class="f-small f-muted" x="94" y="122" text-anchor="middle">first matching rule wins</text>
  <text class="f-small f-strong" x="94" y="180" text-anchor="middle">refused: 403</text>
  <rect class="f-box-accent" x="188" y="20" width="168" height="200" rx="8"/>
  <text class="f-small f-strong f-mono" x="272" y="50" text-anchor="middle">auth_basic</text>
  <text class="f-small" x="272" y="96" text-anchor="middle">user name + password</text>
  <text class="f-small f-muted" x="272" y="122" text-anchor="middle">from an htpasswd file</text>
  <text class="f-small f-strong" x="272" y="180" text-anchor="middle">refused: 401</text>
  <rect class="f-box-ok" x="366" y="20" width="168" height="200" rx="8"/>
  <text class="f-small f-strong f-mono" x="450" y="50" text-anchor="middle">satisfy any</text>
  <text class="f-small" x="450" y="96" text-anchor="middle">IP rule OR password</text>
  <text class="f-small f-muted" x="450" y="122" text-anchor="middle">no prompt inside</text>
  <rect class="f-box-warn" x="544" y="20" width="168" height="200" rx="8"/>
  <text class="f-small f-strong f-mono" x="628" y="50" text-anchor="middle">limit_conn</text>
  <text class="f-small" x="628" y="96" text-anchor="middle">open connections per IP</text>
  <text class="f-small f-muted" x="628" y="122" text-anchor="middle">too many at once</text>
  <text class="f-small f-strong" x="628" y="180" text-anchor="middle">refused: 503</text>
</svg>
