<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340">
  <!-- Reference architecture: event-driven services with a transactional outbox. -->
  <rect class="f-box" x="10" y="40" width="90" height="50" rx="8"/>
  <text class="f-small" x="55" y="70" text-anchor="middle">client</text>
  <rect class="f-box-accent" x="130" y="25" width="140" height="80" rx="8"/>
  <text class="f-small f-strong" x="200" y="55" text-anchor="middle">Order service</text>
  <text class="f-small" x="200" y="75" text-anchor="middle">only writer</text>
  <text class="f-small" x="200" y="91" text-anchor="middle">of orders</text>
  <g>
    <path class="f-arrow" d="M102 65 L120 65"/>
    <polygon class="f-head" points="128,65 120,69.5 120,60.5"/>
  </g>
  <rect class="f-box-ok" x="310" y="20" width="170" height="90" rx="8"/>
  <text class="f-small f-strong" x="395" y="50" text-anchor="middle">PostgreSQL</text>
  <text class="f-small" x="395" y="70" text-anchor="middle">order + outbox row</text>
  <text class="f-small" x="395" y="86" text-anchor="middle">in one transaction</text>
  <g>
    <path class="f-arrow" d="M272 65 L300 65"/>
    <polygon class="f-head" points="308,65 300,69.5 300,60.5"/>
  </g>
  <rect class="f-box" x="520" y="25" width="140" height="80" rx="8"/>
  <text class="f-small f-strong" x="590" y="55" text-anchor="middle">Outbox relay</text>
  <text class="f-small" x="590" y="75" text-anchor="middle">publish, then</text>
  <text class="f-small" x="590" y="91" text-anchor="middle">mark published</text>
  <g>
    <path class="f-arrow" d="M482 65 L510 65"/>
    <polygon class="f-head" points="518,65 510,69.5 510,60.5"/>
  </g>
  <rect class="f-box-accent" x="480" y="170" width="200" height="90" rx="8"/>
  <text class="f-small f-strong" x="580" y="200" text-anchor="middle">Kafka topic</text>
  <text class="f-small" x="580" y="220" text-anchor="middle">key = order ID</text>
  <text class="f-small" x="580" y="236" text-anchor="middle">ordered per partition</text>
  <g>
    <path class="f-arrow" d="M590 107 L590 160"/>
    <polygon class="f-head" points="590,168 585.5,160 594.5,160"/>
  </g>
  <rect class="f-box" x="270" y="150" width="150" height="40" rx="8"/>
  <text class="f-small" x="345" y="175" text-anchor="middle">payment group</text>
  <rect class="f-box" x="270" y="205" width="150" height="40" rx="8"/>
  <text class="f-small" x="345" y="230" text-anchor="middle">shipping group</text>
  <rect class="f-box" x="270" y="260" width="150" height="40" rx="8"/>
  <text class="f-small" x="345" y="285" text-anchor="middle">e-mail group</text>
  <g>
    <path class="f-arrow" d="M478 200 L429.1 173.8"/>
    <polygon class="f-head" points="422,170 431.2,169.8 426.9,177.7"/>
  </g>
  <g>
    <path class="f-arrow" d="M478 215 L429.9 223.6"/>
    <polygon class="f-head" points="422,225 429.1,219.2 430.7,228.0"/>
  </g>
  <g>
    <path class="f-arrow" d="M478 230 L428.0 274.7"/>
    <polygon class="f-head" points="422,280 425.0,271.3 431.0,278.0"/>
  </g>
  <text class="f-small f-muted" x="345" y="140" text-anchor="middle">skip handled event IDs</text>
  <rect class="f-box-warn" x="40" y="240" width="170" height="60" rx="8"/>
  <text class="f-small f-strong" x="125" y="266" text-anchor="middle">retry / dead-letter</text>
  <text class="f-small" x="125" y="284" text-anchor="middle">topics, with reason</text>
  <g>
    <path class="f-arrow" d="M268 170 L216.5 245.4"/>
    <polygon class="f-head" points="212,252 212.8,242.9 220.2,247.9"/>
  </g>
  <g>
    <path class="f-arrow" d="M268 225 L218.5 260.4"/>
    <polygon class="f-head" points="212,265 215.9,256.7 221.1,264.0"/>
  </g>
  <g>
    <path class="f-arrow" d="M268 280 L220 280"/>
    <polygon class="f-head" points="212,280 220,275.5 220,284.5"/>
  </g>
  <rect class="f-box-faint" x="40" y="140" width="170" height="50" rx="8"/>
  <text class="f-small f-strong" x="125" y="162" text-anchor="middle">Redis</text>
  <text class="f-small" x="125" y="178" text-anchor="middle">optional cache</text>
  <g>
    <path class="f-arrow" d="M185 107 L156.0 132.7"/>
    <polygon class="f-head" points="150,138 153.0,129.3 159.0,136.1"/>
  </g>
  <text class="f-small" x="380" y="328" text-anchor="middle">every service, Kafka and PostgreSQL run as containers (Docker Compose locally)</text>
</svg>
