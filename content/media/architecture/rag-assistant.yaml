alt: 'Indexing path: documents such as the handbook and notices go through an indexing pipeline that splits them into chunks with metadata and embeds each chunk once, into PostgreSQL with pgvector, which stores chunks, audience labels and vectors. Question path: a user''s question passes Redis, which applies a rate limit and may return a cached answer, then a retrieval step that searches PostgreSQL only among chunks the user may see and applies a score threshold, refusing when nothing is relevant. Retrieved passages go to the language model as numbered sources marked as data, and a check confirms that every citation in the answer refers to a source that was really sent. The answer returns to the user with its sources. OpenTelemetry traces each question through cache, retrieval, model and checks, and an evaluation set of correctness, faithfulness and abstention gates every change.'
caption: 'Retrieval decides what the model may see; checks decide what the user receives.'
