<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340">
  <!-- Reference architecture: retrieval-augmented assistant with citations. -->
  <rect class="f-box" x="10" y="30" width="125" height="55" rx="8"/>
  <text class="f-small f-strong" x="72" y="54" text-anchor="middle">documents</text>
  <text class="f-small" x="72" y="72" text-anchor="middle">handbook, notices</text>
  <rect class="f-box" x="150" y="25" width="150" height="65" rx="8"/>
  <text class="f-small f-strong" x="225" y="50" text-anchor="middle">indexing pipeline</text>
  <text class="f-small" x="225" y="68" text-anchor="middle">chunks + metadata,</text>
  <text class="f-small" x="225" y="82" text-anchor="middle">embed once</text>
  <g>
    <path class="f-arrow" d="M137 57 L140 57"/>
    <polygon class="f-head" points="148,57 140,61.5 140,52.5"/>
  </g>
  <rect class="f-box-ok" x="340" y="20" width="170" height="75" rx="8"/>
  <text class="f-small f-strong" x="425" y="46" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="f-small" x="425" y="66" text-anchor="middle">chunks, audience,</text>
  <text class="f-small" x="425" y="82" text-anchor="middle">vectors</text>
  <g>
    <path class="f-arrow" d="M302 57 L330 57"/>
    <polygon class="f-head" points="338,57 330,61.5 330,52.5"/>
  </g>
  <rect class="f-box" x="10" y="190" width="90" height="50" rx="8"/>
  <text class="f-small" x="55" y="220" text-anchor="middle">user</text>
  <rect class="f-box-ok" x="130" y="180" width="120" height="65" rx="8"/>
  <text class="f-small f-strong" x="190" y="205" text-anchor="middle">Redis</text>
  <text class="f-small" x="190" y="223" text-anchor="middle">rate limit,</text>
  <text class="f-small" x="190" y="237" text-anchor="middle">answer cache</text>
  <g>
    <path class="f-arrow" d="M102 215 L120.1 212.9"/>
    <polygon class="f-head" points="128,212 120.6,217.4 119.5,208.4"/>
  </g>
  <rect class="f-box-accent" x="290" y="175" width="150" height="80" rx="8"/>
  <text class="f-small f-strong" x="365" y="203" text-anchor="middle">retrieve</text>
  <text class="f-small" x="365" y="221" text-anchor="middle">audience filter,</text>
  <text class="f-small" x="365" y="237" text-anchor="middle">score threshold</text>
  <g>
    <path class="f-arrow" d="M252 212 L280 212"/>
    <polygon class="f-head" points="288,212 280,216.5 280,207.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M390 173 L417.1 104.4"/>
    <polygon class="f-head" points="420,97 421.2,106.1 412.9,102.8"/>
  </g>
  <text class="f-small f-muted" x="290" y="140" text-anchor="middle">nothing relevant: refuse</text>
  <rect class="f-box" x="478" y="180" width="122" height="65" rx="8"/>
  <text class="f-small f-strong" x="539" y="205" text-anchor="middle">language model</text>
  <text class="f-small" x="539" y="223" text-anchor="middle">numbered</text>
  <text class="f-small" x="539" y="237" text-anchor="middle">sources as data</text>
  <g>
    <path class="f-arrow" d="M442 212 L468 212"/>
    <polygon class="f-head" points="476,212 468,216.5 468,207.5"/>
  </g>
  <rect class="f-box-warn" x="625" y="175" width="125" height="75" rx="8"/>
  <text class="f-small f-strong" x="687" y="203" text-anchor="middle">check citations</text>
  <text class="f-small" x="687" y="221" text-anchor="middle">each [n] was</text>
  <text class="f-small" x="687" y="237" text-anchor="middle">really sent</text>
  <g>
    <path class="f-arrow" d="M602 212 L615 212"/>
    <polygon class="f-head" points="623,212 615,216.5 615,207.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M687 252 L687 282 L55 282 L55 250"/>
    <polygon class="f-head" points="55,242 59.5,250 50.5,250"/>
  </g>
  <text class="f-small f-muted" x="380" y="276" text-anchor="middle">answer + sources</text>
  <text class="f-small" x="380" y="310" text-anchor="middle">OpenTelemetry traces each question through cache, retrieval, model and checks;</text>
  <text class="f-small" x="380" y="327" text-anchor="middle">an evaluation set (correctness, faithfulness, abstention) gates every change</text>
</svg>
