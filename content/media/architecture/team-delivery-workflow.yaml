alt: 'A Jira work item, such as DEV-12 with acceptance criteria on a WIP-limited board, leads to a branch named after the key with the key in every commit message, then to a small reviewed pull request with the key in its title, and finally to a protected main branch that accepts a merge only with a review and green checks. Jira links the branch, commits and pull request back to the work item by its key. The pull request triggers CI, which runs the unit tests, runs the Postman collection of API tests with Newman against a freshly started API, checks the keys, and reports its status back. On main, a version tag starts a release workflow that runs the tests again and writes release notes grouped by work item. Flow metrics - cycle time, work in progress and throughput - come from the work items'' status history. The Jira fix version matches the tag.'
caption: 'One key travels from the work item to the release notes; required checks guard main.'
