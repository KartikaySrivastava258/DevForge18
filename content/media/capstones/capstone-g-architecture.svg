<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <!-- Capstone G architecture: workflows with guard rails. -->
  <rect class="f-box" x="20" y="30" width="150" height="110" rx="8"/>
  <text class="f-small f-strong" x="95" y="58" text-anchor="middle">triggers</text>
  <text class="f-small" x="95" y="80" text-anchor="middle">forms (webhooks),</text>
  <text class="f-small" x="95" y="98" text-anchor="middle">schedules,</text>
  <text class="f-small" x="95" y="116" text-anchor="middle">support e-mail</text>
  <rect class="f-box-accent" x="220" y="20" width="260" height="160" rx="8"/>
  <text class="f-small f-strong" x="350" y="45" text-anchor="middle">n8n (self-hosted)</text>
  <text class="f-small" x="350" y="70" text-anchor="middle">validate → deduplicate → act</text>
  <text class="f-small" x="350" y="92" text-anchor="middle">error workflow, retries</text>
  <text class="f-small" x="350" y="114" text-anchor="middle">human approval (Wait)</text>
  <text class="f-small" x="350" y="136" text-anchor="middle">credentials referenced,</text>
  <text class="f-small" x="350" y="156" text-anchor="middle">never embedded</text>
  <g>
    <path class="f-arrow" d="M172 85 L210 85"/>
    <polygon class="f-head" points="218,85 210,89.5 210,80.5"/>
  </g>
  <rect class="f-box-ok" x="530" y="20" width="210" height="70" rx="8"/>
  <text class="f-small f-strong" x="635" y="48" text-anchor="middle">PostgreSQL</text>
  <text class="f-small" x="635" y="68" text-anchor="middle">records, audit trail</text>
  <rect class="f-box-ok" x="530" y="110" width="210" height="70" rx="8"/>
  <text class="f-small f-strong" x="635" y="138" text-anchor="middle">Redis</text>
  <text class="f-small" x="635" y="158" text-anchor="middle">idempotency keys, limits</text>
  <g>
    <path class="f-arrow" d="M482 60 L520.0 55.9"/>
    <polygon class="f-head" points="528,55 520.5,60.3 519.6,51.4"/>
  </g>
  <g>
    <path class="f-arrow" d="M482 130 L520.4 142.5"/>
    <polygon class="f-head" points="528,145 519.0,146.8 521.8,138.2"/>
  </g>
  <rect class="f-box" x="220" y="220" width="260" height="60" rx="8"/>
  <text class="f-small" x="350" y="245" text-anchor="middle">external APIs: e-mail, calendar,</text>
  <text class="f-small" x="350" y="263" text-anchor="middle">ticketing, an LLM classifier</text>
  <g>
    <path class="f-arrow" d="M350 182 L350 210"/>
    <polygon class="f-head" points="350,218 345.5,210 354.5,210"/>
  </g>
  <rect class="f-box" x="20" y="300" width="340" height="66" rx="8"/>
  <text class="f-small" x="190" y="326" text-anchor="middle">Postman collections test every API</text>
  <text class="f-small" x="190" y="346" text-anchor="middle">the workflows call, and the webhooks</text>
  <rect class="f-box" x="400" y="300" width="340" height="66" rx="8"/>
  <text class="f-small" x="570" y="326" text-anchor="middle">OpenTelemetry + Docker Compose:</text>
  <text class="f-small" x="570" y="346" text-anchor="middle">traced, reproducible, self-hosted</text>
</svg>
