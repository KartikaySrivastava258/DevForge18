<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <!-- Capstone A architecture: synchronous orders, asynchronous fulfilment. -->
  <rect class="f-box-faint" x="10" y="10" width="740" height="300" rx="8"/>
  <text class="f-small f-strong" x="120" y="32" text-anchor="middle">Kubernetes cluster (kind)</text>
  <rect class="f-box" x="20" y="130" width="100" height="60" rx="8"/>
  <text class="f-small" x="70" y="165" text-anchor="middle">shoppers</text>
  <rect class="f-box-accent" x="150" y="120" width="110" height="80" rx="8"/>
  <text class="f-small f-strong" x="205" y="150" text-anchor="middle">Nginx</text>
  <text class="f-small" x="205" y="170" text-anchor="middle">ingress, limits</text>
  <g>
    <path class="f-arrow" d="M122 160 L140 160"/>
    <polygon class="f-head" points="148,160 140,164.5 140,155.5"/>
  </g>
  <rect class="f-box" x="300" y="50" width="130" height="60" rx="8"/>
  <text class="f-small f-strong" x="365" y="77" text-anchor="middle">catalogue</text>
  <text class="f-small" x="365" y="95" text-anchor="middle">service</text>
  <rect class="f-box" x="300" y="170" width="130" height="60" rx="8"/>
  <text class="f-small f-strong" x="365" y="197" text-anchor="middle">orders</text>
  <text class="f-small" x="365" y="215" text-anchor="middle">service + outbox</text>
  <g>
    <path class="f-arrow" d="M262 145 L293.9 91.9"/>
    <polygon class="f-head" points="298,85 297.7,94.2 290.0,89.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M262 175 L291.0 191.1"/>
    <polygon class="f-head" points="298,195 288.8,195.0 293.2,187.2"/>
  </g>
  <rect class="f-box-ok" x="470" y="40" width="120" height="60" rx="8"/>
  <text class="f-small f-strong" x="530" y="67" text-anchor="middle">Redis</text>
  <text class="f-small" x="530" y="85" text-anchor="middle">cache, holds</text>
  <rect class="f-box-ok" x="470" y="160" width="120" height="70" rx="8"/>
  <text class="f-small f-strong" x="530" y="190" text-anchor="middle">PostgreSQL</text>
  <text class="f-small" x="530" y="210" text-anchor="middle">orders, outbox</text>
  <g>
    <path class="f-arrow" d="M432 75 L460.1 71.1"/>
    <polygon class="f-head" points="468,70 460.7,75.6 459.5,66.6"/>
  </g>
  <g>
    <path class="f-arrow" d="M432 200 L460.0 197.7"/>
    <polygon class="f-head" points="468,197 460.4,202.1 459.7,193.2"/>
  </g>
  <rect class="f-box-warn" x="620" y="160" width="120" height="70" rx="8"/>
  <text class="f-small f-strong" x="680" y="190" text-anchor="middle">Kafka</text>
  <text class="f-small" x="680" y="210" text-anchor="middle">order events</text>
  <g>
    <path class="f-arrow" d="M592 195 L610 195"/>
    <polygon class="f-head" points="618,195 610,199.5 610,190.5"/>
  </g>
  <rect class="f-box" x="470" y="250" width="270" height="50" rx="8"/>
  <text class="f-small" x="605" y="272" text-anchor="middle">payment, shipping, email consumers</text>
  <text class="f-small" x="605" y="290" text-anchor="middle">(consumer groups, dead-letter topic)</text>
  <g>
    <path class="f-arrow" d="M680 232 L680 240"/>
    <polygon class="f-head" points="680,248 675.5,240 684.5,240"/>
  </g>
  <rect class="f-box" x="20" y="340" width="340" height="66" rx="8"/>
  <text class="f-small" x="190" y="366" text-anchor="middle">OpenTelemetry: one trace per order,</text>
  <text class="f-small" x="190" y="386" text-anchor="middle">across HTTP and Kafka hops</text>
  <rect class="f-box" x="400" y="340" width="340" height="66" rx="8"/>
  <text class="f-small" x="570" y="366" text-anchor="middle">Prometheus + Grafana: latency, errors,</text>
  <text class="f-small" x="570" y="386" text-anchor="middle">consumer lag, SLO burn-rate alerts</text>
