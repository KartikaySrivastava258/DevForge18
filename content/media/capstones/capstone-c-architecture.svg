<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <!-- Capstone C architecture: retrieval with citations, guarded tools, measured quality. -->
  <rect class="f-box" x="20" y="30" width="150" height="70" rx="8"/>
  <text class="f-small f-strong" x="95" y="60" text-anchor="middle">college documents</text>
  <text class="f-small" x="95" y="80" text-anchor="middle">handbook, notices</text>
  <rect class="f-box-accent" x="220" y="30" width="150" height="70" rx="8"/>
  <text class="f-small f-strong" x="295" y="60" text-anchor="middle">ingestion job</text>
  <text class="f-small" x="295" y="80" text-anchor="middle">chunk, embed, label</text>
  <g>
    <path class="f-arrow" d="M172 65 L210 65"/>
    <polygon class="f-head" points="218,65 210,69.5 210,60.5"/>
  </g>
  <rect class="f-box-ok" x="420" y="20" width="160" height="90" rx="8"/>
  <text class="f-small f-strong" x="500" y="50" text-anchor="middle">PostgreSQL</text>
  <text class="f-small" x="500" y="70" text-anchor="middle">chunks, metadata,</text>
  <text class="f-small" x="500" y="88" text-anchor="middle">access rules</text>
  <g>
    <path class="f-arrow" d="M372 65 L410 65"/>
    <polygon class="f-head" points="418,65 410,69.5 410,60.5"/>
  </g>
  <rect class="f-box" x="20" y="180" width="120" height="60" rx="8"/>
  <text class="f-small" x="80" y="215" text-anchor="middle">students</text>
  <rect class="f-box-accent" x="190" y="165" width="190" height="90" rx="8"/>
  <text class="f-small f-strong" x="285" y="195" text-anchor="middle">assistant API</text>
  <text class="f-small" x="285" y="215" text-anchor="middle">retrieve, cite, refuse</text>
  <text class="f-small" x="285" y="233" text-anchor="middle">allow-listed tools</text>
  <g>
    <path class="f-arrow" d="M142 210 L180 210"/>
    <polygon class="f-head" points="188,210 180,214.5 180,205.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M330 163 L442.6 115.1"/>
    <polygon class="f-head" points="450,112 444.4,119.3 440.9,111.0"/>
  </g>
  <rect class="f-box-ok" x="430" y="180" width="150" height="60" rx="8"/>
  <text class="f-small f-strong" x="505" y="207" text-anchor="middle">Redis</text>
  <text class="f-small" x="505" y="225" text-anchor="middle">answer cache, limits</text>
  <g>
    <path class="f-arrow" d="M382 210 L420 210"/>
    <polygon class="f-head" points="428,210 420,214.5 420,205.5"/>
  </g>
  <rect class="f-box-warn" x="620" y="160" width="120" height="100" rx="8"/>
  <text class="f-small f-strong" x="680" y="190" text-anchor="middle">language</text>
  <text class="f-small f-strong" x="680" y="208" text-anchor="middle">model</text>
  <text class="f-small" x="680" y="230" text-anchor="middle">(behind an</text>
  <text class="f-small" x="680" y="246" text-anchor="middle">interface)</text>
  <g>
    <path class="f-arrow" d="M582 225 L610 225"/>
    <polygon class="f-head" points="618,225 610,229.5 610,220.5"/>
  </g>
  <rect class="f-box" x="20" y="300" width="350" height="80" rx="8"/>
  <text class="f-small" x="195" y="328" text-anchor="middle">evaluation set in Git: questions,</text>
  <text class="f-small" x="195" y="346" text-anchor="middle">expected sources, injection cases;</text>
  <text class="f-small" x="195" y="364" text-anchor="middle">run in CI as a release gate</text>
  <rect class="f-box" x="400" y="300" width="340" height="80" rx="8"/>
  <text class="f-small" x="570" y="328" text-anchor="middle">OpenTelemetry: one trace per question —</text>
  <text class="f-small" x="570" y="346" text-anchor="middle">retrieval, model call, tool calls,</text>
  <text class="f-small" x="570" y="364" text-anchor="middle">latency and token cost</text>
</svg>
