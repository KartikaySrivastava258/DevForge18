<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <!-- Capstone E architecture: from a commit to a monitored model. -->
  <rect class="f-box" x="20" y="30" width="140" height="70" rx="8"/>
  <text class="f-small f-strong" x="90" y="58" text-anchor="middle">Git repository</text>
  <text class="f-small" x="90" y="78" text-anchor="middle">code, config, data</text>
  <rect class="f-box-accent" x="200" y="30" width="170" height="70" rx="8"/>
  <text class="f-small f-strong" x="285" y="58" text-anchor="middle">Airflow training DAG</text>
  <text class="f-small" x="285" y="78" text-anchor="middle">prepare, train, evaluate</text>
  <g>
    <path class="f-arrow" d="M162 65 L190 65"/>
    <polygon class="f-head" points="198,65 190,69.5 190,60.5"/>
  </g>
  <rect class="f-box-ok" x="410" y="20" width="170" height="90" rx="8"/>
  <text class="f-small f-strong" x="495" y="48" text-anchor="middle">MLflow tracking</text>
  <text class="f-small" x="495" y="68" text-anchor="middle">runs, params, metrics,</text>
  <text class="f-small" x="495" y="86" text-anchor="middle">lineage tags</text>
  <g>
    <path class="f-arrow" d="M372 65 L400 65"/>
    <polygon class="f-head" points="408,65 400,69.5 400,60.5"/>
  </g>
  <rect class="f-box-ok" x="620" y="20" width="120" height="90" rx="8"/>
  <text class="f-small f-strong" x="680" y="50" text-anchor="middle">PostgreSQL</text>
  <text class="f-small" x="680" y="70" text-anchor="middle">MLflow backend</text>
  <text class="f-small" x="680" y="88" text-anchor="middle">store</text>
  <g>
    <path class="f-arrow" d="M582 65 L610 65"/>
    <polygon class="f-head" points="618,65 610,69.5 610,60.5"/>
  </g>
  <rect class="f-box-warn" x="410" y="150" width="170" height="70" rx="8"/>
  <text class="f-small f-strong" x="495" y="178" text-anchor="middle">Model Registry</text>
  <text class="f-small f-mono" x="495" y="198" text-anchor="middle">alias: champion</text>
  <g>
    <path class="f-arrow" d="M495 112 L495 140"/>
    <polygon class="f-head" points="495,148 490.5,140 499.5,140"/>
  </g>
  <text class="f-small" x="560" y="135" text-anchor="middle">promote only if better</text>
  <rect class="f-box-faint" x="20" y="150" width="340" height="120" rx="8"/>
  <text class="f-small f-strong" x="250" y="186" text-anchor="middle">Kubernetes (kind)</text>
  <rect class="f-box" x="40" y="190" width="140" height="60" rx="8"/>
  <text class="f-small f-strong" x="110" y="216" text-anchor="middle">model API</text>
  <text class="f-small" x="110" y="234" text-anchor="middle">2 replicas, probes</text>
  <rect class="f-box" x="200" y="190" width="140" height="60" rx="8"/>
  <text class="f-small f-strong" x="270" y="216" text-anchor="middle">drift job</text>
  <text class="f-small" x="270" y="234" text-anchor="middle">inputs vs training</text>
  <g>
    <path class="f-arrow" d="M408 168 L110 168 L110 180"/>
    <polygon class="f-head" points="110,188 105.5,180 114.5,180"/>
  </g>
  <rect class="f-box" x="410" y="260" width="330" height="90" rx="8"/>
  <text class="f-small" x="575" y="288" text-anchor="middle">Prometheus + Grafana: latency, errors,</text>
  <text class="f-small" x="575" y="308" text-anchor="middle">predictions per minute, drift score;</text>
  <text class="f-small" x="575" y="328" text-anchor="middle">alerts trigger retraining review</text>
  <g>
    <path class="f-arrow" d="M270 252 L400.4 297.4"/>
    <polygon class="f-head" points="408,300 399.0,301.6 401.9,293.1"/>
  </g>
  <rect class="f-box" x="20" y="300" width="340" height="60" rx="8"/>
  <text class="f-small" x="190" y="324" text-anchor="middle">Docker images pinned by digest;</text>
  <text class="f-small" x="190" y="342" text-anchor="middle">CI builds, tests and scans them</text>
</svg>
