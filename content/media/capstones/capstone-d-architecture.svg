<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <!-- Capstone D architecture: streams and files in, audited tables out. -->
  <rect class="f-box" x="20" y="30" width="150" height="60" rx="8"/>
  <text class="f-small" x="95" y="57" text-anchor="middle">badge, library,</text>
  <text class="f-small" x="95" y="75" text-anchor="middle">canteen events</text>
  <rect class="f-box-warn" x="220" y="30" width="130" height="60" rx="8"/>
  <text class="f-small f-strong" x="285" y="57" text-anchor="middle">Kafka</text>
  <text class="f-small" x="285" y="75" text-anchor="middle">raw event topics</text>
  <g>
    <path class="f-arrow" d="M172 60 L210 60"/>
    <polygon class="f-head" points="218,60 210,64.5 210,55.5"/>
  </g>
  <rect class="f-box" x="20" y="130" width="150" height="60" rx="8"/>
  <text class="f-small" x="95" y="157" text-anchor="middle">daily CSV exports</text>
  <text class="f-small" x="95" y="175" text-anchor="middle">(marks, loans)</text>
  <rect class="f-box" x="400" y="20" width="160" height="80" rx="8"/>
  <text class="f-small f-strong" x="480" y="50" text-anchor="middle">landing consumer</text>
  <text class="f-small" x="480" y="70" text-anchor="middle">events → raw tables</text>
  <text class="f-small" x="480" y="86" text-anchor="middle">(idempotent)</text>
  <g>
    <path class="f-arrow" d="M352 60 L390 60"/>
    <polygon class="f-head" points="398,60 390,64.5 390,55.5"/>
  </g>
  <rect class="f-box-accent" x="220" y="120" width="340" height="100" rx="8"/>
  <text class="f-small f-strong" x="390" y="145" text-anchor="middle">Airflow DAGs (daily, backfillable)</text>
  <text class="f-small" x="390" y="168" text-anchor="middle">stage → audit (quality checks) → publish</text>
  <text class="f-small" x="390" y="188" text-anchor="middle">quarantine bad rows, alert on failures</text>
  <text class="f-small" x="390" y="206" text-anchor="middle">logical dates, retries, idempotent loads</text>
  <g>
    <path class="f-arrow" d="M172 160 L210.0 164.1"/>
    <polygon class="f-head" points="218,165 209.6,168.6 210.5,159.7"/>
  </g>
  <g>
    <path class="f-arrow" d="M480 102 L480 110"/>
    <polygon class="f-head" points="480,118 475.5,110 484.5,110"/>
  </g>
  <rect class="f-box-ok" x="610" y="110" width="130" height="120" rx="8"/>
  <text class="f-small f-strong" x="675" y="140" text-anchor="middle">PostgreSQL</text>
  <text class="f-small" x="675" y="162" text-anchor="middle">raw, staging,</text>
  <text class="f-small" x="675" y="180" text-anchor="middle">warehouse schemas,</text>
  <text class="f-small" x="675" y="198" text-anchor="middle">indexes, views</text>
  <g>
    <path class="f-arrow" d="M562 170 L600 170"/>
    <polygon class="f-head" points="608,170 600,174.5 600,165.5"/>
  </g>
  <rect class="f-box" x="220" y="260" width="340" height="60" rx="8"/>
  <text class="f-small" x="390" y="285" text-anchor="middle">reports and dashboards read only</text>
  <text class="f-small" x="390" y="303" text-anchor="middle">published tables (read-only role)</text>
  <g>
    <path class="f-arrow" d="M675 232 L569.2 281.6"/>
    <polygon class="f-head" points="562,285 567.3,277.5 571.2,285.7"/>
  </g>
  <rect class="f-box" x="20" y="260" width="170" height="100" rx="8"/>
  <text class="f-small f-strong" x="105" y="290" text-anchor="middle">Prometheus +</text>
  <text class="f-small" x="105" y="308" text-anchor="middle">Grafana: freshness,</text>
  <text class="f-small" x="105" y="326" text-anchor="middle">failed runs, lag,</text>
  <text class="f-small" x="105" y="344" text-anchor="middle">rows quarantined</text>
  <rect class="f-box" x="610" y="260" width="130" height="100" rx="8"/>
  <text class="f-small f-strong" x="675" y="290" text-anchor="middle">Docker Compose</text>
  <text class="f-small" x="675" y="308" text-anchor="middle">the whole</text>
  <text class="f-small" x="675" y="326" text-anchor="middle">platform, one</text>
  <text class="f-small" x="675" y="344" text-anchor="middle">command</text>
</svg>
