<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <!-- Numbered diagram for the Redis track quiz: label the parts of a persistent, replicated Redis. -->
  <text class="f-small" x="95" y="62" text-anchor="middle">application</text>
  <text class="f-small" x="95" y="79" text-anchor="middle">(reads and writes)</text>
  <g>
    <path class="f-arrow" d="M95 90 L95 128"/>
    <polygon class="f-head" points="95,136 90.5,128 99.5,128"/>
  </g>
  <rect class="f-box-faint" x="20" y="140" width="150" height="80" rx="8"/>
  <text class="f-strong" x="95" y="187" text-anchor="middle">1</text>
  <rect class="f-box-faint" x="305" y="20" width="150" height="70" rx="8"/>
  <text class="f-strong" x="380" y="62" text-anchor="middle">2</text>
  <rect class="f-box-faint" x="305" y="230" width="150" height="70" rx="8"/>
  <text class="f-strong" x="380" y="272" text-anchor="middle">3</text>
  <rect class="f-box-faint" x="590" y="140" width="150" height="80" rx="8"/>
  <text class="f-strong" x="665" y="187" text-anchor="middle">4</text>
  <g>
    <path class="f-arrow" d="M172 165 L296 75"/>
    <polygon class="f-head" points="302,70 297.5,79 292.5,72"/>
  </g>
  <text class="f-small" x="215" y="95" text-anchor="middle">every write,</text>
  <text class="f-small f-mono" x="215" y="112" text-anchor="middle">everysec</text>
  <g>
    <path class="f-arrow" d="M172 200 L296 252"/>
    <polygon class="f-head" points="303,255 293.5,256.5 296.5,248.5"/>
  </g>
  <text class="f-small" x="215" y="262" text-anchor="middle">at intervals</text>
  <text class="f-small f-mono" x="215" y="279" text-anchor="middle">or BGSAVE</text>
  <g>
    <path class="f-arrow" d="M172 180 L580 180"/>
    <polygon class="f-head" points="588,180 580,184.5 580,175.5"/>
  </g>
  <text class="f-small" x="470" y="170" text-anchor="middle">asynchronous copy</text>
  <text class="f-small" x="665" y="240" text-anchor="middle">read-only</text>
</svg>
