<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <!-- Reads go to Redis first; writes go to PostgreSQL and then remove the cached copy. -->
  <rect class="f-box" x="20" y="110" width="130" height="70" rx="8"/>
  <text class="f-small f-strong" x="85" y="140" text-anchor="middle">application</text>
  <text class="f-small f-mono" x="85" y="160" text-anchor="middle">(app.py)</text>
  <rect class="f-box-ok" x="300" y="20" width="160" height="80" rx="8"/>
  <text class="f-small f-strong" x="380" y="50" text-anchor="middle">Redis</text>
  <text class="f-small f-mono" x="380" y="70" text-anchor="middle">course:CS101</text>
  <text class="f-small" x="380" y="88" text-anchor="middle">TTL 60 s</text>
  <rect class="f-box-ok" x="300" y="190" width="160" height="80" rx="8"/>
  <text class="f-small f-strong" x="380" y="220" text-anchor="middle">PostgreSQL</text>
  <text class="f-small" x="380" y="240" text-anchor="middle">courses table</text>
  <text class="f-small" x="380" y="258" text-anchor="middle">(source of truth)</text>
  <g>
    <path class="f-arrow" d="M152 125 L290.7 63.3"/>
    <polygon class="f-head" points="298,60 292.5,67.4 288.9,59.1"/>
  </g>
  <text class="f-small" x="215" y="78" text-anchor="middle">1. read: GET</text>
  <g>
    <path class="f-arrow" d="M152 150 L290.7 211.7"/>
    <polygon class="f-head" points="298,215 288.9,215.9 292.5,207.6"/>
  </g>
  <text class="f-small" x="200" y="205" text-anchor="middle">2. on a miss: SELECT</text>
  <g>
    <path class="f-arrow" d="M380 188 L380 110"/>
    <polygon class="f-head" points="380,102 384.5,110 375.5,110"/>
  </g>
  <text class="f-small" x="470" y="150" text-anchor="middle">3. SET with TTL</text>
  <rect class="f-box-warn" x="520" y="110" width="190" height="80" rx="8"/>
  <text class="f-small f-strong" x="615" y="138" text-anchor="middle">write path</text>
  <text class="f-small" x="615" y="158" text-anchor="middle">UPDATE in a transaction,</text>
  <text class="f-small" x="615" y="176" text-anchor="middle">then DEL the key</text>
</svg>
