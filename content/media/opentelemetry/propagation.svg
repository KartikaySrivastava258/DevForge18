<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270">
  <!-- Context propagation between two services, from Instrumenting a Node.js service. -->
  <rect class="f-box" x="16" y="20" width="120" height="46" rx="8"/>
  <text class="f-strong" x="76" y="48" text-anchor="middle">curl</text>
  <rect class="f-box-faint" x="196" y="12" width="196" height="170" rx="8"/>
  <text class="f-strong" x="294" y="34" text-anchor="middle">frontend :7001</text>
  <rect class="f-box-faint" x="468" y="12" width="156" height="170" rx="8"/>
  <text class="f-strong" x="546" y="34" text-anchor="middle">backend :7002</text>
  <g data-step="1">
    <g>
      <path class="f-arrow" d="M138 43 L198 43"/>
      <polygon class="f-head" points="206,43 198,47.5 198,38.5"/>
    </g>
    <text class="f-small f-muted" x="172" y="36" text-anchor="middle">GET</text>
    <rect class="f-box-accent" x="210" y="46" width="168" height="40" rx="4"/>
    <text class="f-small f-strong" x="294" y="64" text-anchor="middle">Server span (root)</text>
    <text class="f-small f-muted" x="294" y="80" text-anchor="middle">new trace ID</text>
  </g>
  <g data-step="2">
    <rect class="f-box-accent" x="226" y="96" width="152" height="40" rx="4"/>
    <text class="f-small f-strong" x="302" y="114" text-anchor="middle">Client span</text>
    <text class="f-small f-muted" x="302" y="130" text-anchor="middle">parent: Server span</text>
    <g>
      <path class="f-arrow-accent" d="M380 116 L468 116"/>
      <polygon class="f-head-accent" points="476,116 468,120.5 468,111.5"/>
    </g>
    <text class="f-mono f-small" x="428" y="108" text-anchor="middle">traceparent</text>
    <text class="f-mono f-small" x="428" y="152" text-anchor="middle">00-trace-client-01</text>
  </g>
  <g data-step="3">
    <rect class="f-box-accent" x="480" y="96" width="132" height="40" rx="4"/>
    <text class="f-small f-strong" x="546" y="114" text-anchor="middle">Server span</text>
    <text class="f-small f-muted" x="546" y="130" text-anchor="middle">parent: Client span</text>
  </g>
  <g data-step="4">
    <rect class="f-box-ok" x="196" y="214" width="428" height="44" rx="8"/>
    <text class="f-small f-strong" x="410" y="241" text-anchor="middle">Collector: 3 spans, 1 trace ID, 2 services</text>
    <g>
      <path class="f-arrow" d="M294 184 L294 204"/>
      <polygon class="f-head" points="294,212 289.5,204 298.5,204"/>
    </g>
    <g>
      <path class="f-arrow" d="M546 184 L546 204"/>
      <polygon class="f-head" points="546,212 541.5,204 550.5,204"/>
    </g>
    <text class="f-small f-muted" x="304" y="202">OTLP</text>
    <text class="f-small f-muted" x="556" y="202">OTLP</text>
  </g>
</svg>
