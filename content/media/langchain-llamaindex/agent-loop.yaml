alt: 'The model replies with text or with tool calls. Your loop, which runs every tool, checks each call in turn: is the tool on this agent''s allowlist, do the arguments match its schema, does a high-impact action need a person''s approval, and has the step limit been reached. Allowed calls run the tools, here get_order and refund, and the result goes back to the model. Every request, run and refusal is written to an audit log.'
caption: 'The model only asks; your loop checks, runs, records — and stops.'
