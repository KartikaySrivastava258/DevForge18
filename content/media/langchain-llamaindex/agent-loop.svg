<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <!-- The agent loop and its guards, from Tool calling and agents, safely. -->
  <rect class="f-box-faint" x="10" y="110" width="150" height="80" rx="8"/>
  <text class="f-small f-strong" x="85" y="140" text-anchor="middle">model</text>
  <text class="f-small" x="85" y="164" text-anchor="middle">text or tool_calls</text>
  <rect class="f-box-accent" x="220" y="20" width="280" height="280" rx="8"/>
  <text class="f-small f-strong" x="360" y="44" text-anchor="middle">your loop (runs every tool)</text>
  <rect class="f-box-faint" x="235" y="60" width="250" height="48" rx="8"/>
  <text class="f-small f-strong" x="360" y="80" text-anchor="middle">allowlist</text>
  <text class="f-small" x="360" y="98" text-anchor="middle">tool offered to this agent?</text>
  <rect class="f-box-faint" x="235" y="118" width="250" height="48" rx="8"/>
  <text class="f-small f-strong" x="360" y="138" text-anchor="middle">validate</text>
  <text class="f-small" x="360" y="156" text-anchor="middle">arguments match the schema?</text>
  <rect class="f-box-faint" x="235" y="176" width="250" height="48" rx="8"/>
  <text class="f-small f-strong" x="360" y="196" text-anchor="middle">approve</text>
  <text class="f-small" x="360" y="214" text-anchor="middle">high impact → a person decides</text>
  <rect class="f-box-faint" x="235" y="234" width="250" height="48" rx="8"/>
  <text class="f-small f-strong" x="360" y="254" text-anchor="middle">step limit</text>
  <text class="f-small" x="360" y="272" text-anchor="middle">stop after N turns</text>
  <rect class="f-box-ok" x="560" y="60" width="150" height="80" rx="8"/>
  <text class="f-small f-strong" x="635" y="92" text-anchor="middle">tools</text>
  <text class="f-small f-mono" x="635" y="114" text-anchor="middle">get_order, refund</text>
  <rect class="f-box-faint" x="560" y="180" width="150" height="80" rx="8"/>
  <text class="f-small f-strong" x="635" y="212" text-anchor="middle">audit log</text>
  <text class="f-small" x="635" y="234" text-anchor="middle">asked · ran · refused</text>
  <g>
    <path class="f-arrow" d="M162 140 L210 140"/>
    <polygon class="f-head" points="218,140 210,144.5 210,135.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M218 170 L170 170"/>
    <polygon class="f-head" points="162,170 170,165.5 170,174.5"/>
  </g>
  <text class="f-small" x="190" y="128" text-anchor="middle">call</text>
  <text class="f-small" x="190" y="186" text-anchor="middle">result</text>
  <g>
    <path class="f-arrow" d="M502 100 L550 100"/>
    <polygon class="f-head" points="558,100 550,104.5 550,95.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M502 220 L550 220"/>
    <polygon class="f-head" points="558,220 550,224.5 550,215.5"/>
  </g>
</svg>
