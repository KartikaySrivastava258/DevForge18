<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230">
  <!-- Partitions shared by a consumer group, from Scaling consumers and rebalancing. -->
  <rect class="f-box-faint" x="16" y="14" width="200" height="202" rx="8"/>
  <text class="f-mono" x="116" y="36" text-anchor="middle">topic orders</text>
  <rect class="f-box-accent" x="32" y="52" width="168" height="40" rx="4"/>
  <text class="f-small f-strong" x="116" y="77" text-anchor="middle">partition 0</text>
  <rect class="f-box-accent" x="32" y="104" width="168" height="40" rx="4"/>
  <text class="f-small f-strong" x="116" y="129" text-anchor="middle">partition 1</text>
  <rect class="f-box-accent" x="32" y="156" width="168" height="40" rx="4"/>
  <text class="f-small f-strong" x="116" y="181" text-anchor="middle">partition 2</text>
  <rect class="f-box-faint" x="312" y="14" width="312" height="202" rx="8"/>
  <text class="f-small f-strong" x="468" y="36" text-anchor="middle">group shipping (4 members)</text>
  <rect class="f-box" x="330" y="50" width="276" height="32" rx="4"/>
  <text class="f-small f-strong" x="346" y="71">member 1</text>
  <text class="f-small" x="592" y="71" text-anchor="end">partition 0</text>
  <g>
    <path class="f-arrow" d="M202 72 L320.0 66.4"/>
    <polygon class="f-head" points="328,66 320.2,70.9 319.8,61.9"/>
  </g>
  <rect class="f-box" x="330" y="90" width="276" height="32" rx="4"/>
  <text class="f-small f-strong" x="346" y="111">member 2</text>
  <text class="f-small" x="592" y="111" text-anchor="end">partition 1</text>
  <g>
    <path class="f-arrow" d="M202 124 L320.1 107.1"/>
    <polygon class="f-head" points="328,106 320.7,111.6 319.4,102.7"/>
  </g>
  <rect class="f-box" x="330" y="130" width="276" height="32" rx="4"/>
  <text class="f-small f-strong" x="346" y="151">member 3</text>
  <text class="f-small" x="592" y="151" text-anchor="end">partition 2</text>
  <g>
    <path class="f-arrow" d="M202 176 L320.2 147.9"/>
    <polygon class="f-head" points="328,146 321.3,152.2 319.2,143.5"/>
  </g>
  <rect class="f-box-faint" x="330" y="170" width="276" height="32" rx="4"/>
  <text class="f-small f-strong" x="346" y="191">member 4</text>
  <text class="f-small f-muted" x="592" y="191" text-anchor="end">idle — no partition</text>
  <text class="f-small f-muted" x="468" y="208" text-anchor="middle">each partition: one member per group</text>
</svg>
