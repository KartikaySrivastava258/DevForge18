  <text class="f-strong" x="222" y="58">2</text>
  <text class="f-small" x="325" y="58" text-anchor="middle">topic "orders"</text>
  <rect class="f-box-faint" x="230" y="80" width="190" height="45" rx="6"/>
  <text class="f-strong" x="250" y="108">3</text>
  <text class="f-small f-mono" x="275" y="108">0 1 2 3 4 5 6 →</text>
  <rect class="f-box-faint" x="230" y="140" width="190" height="45" rx="6"/>
  <text class="f-small f-mono" x="275" y="168">0 1 2 3 →</text>
