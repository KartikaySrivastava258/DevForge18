  </g>
  <g data-step="4">
    <g>
      <path class="f-arrow-accent" d="M64 120 L64 98"/>
      <polygon class="f-head-accent" points="64,90 68.5,98 59.5,98"/>
    </g>
    <text class="f-small f-strong" x="64" y="138" text-anchor="middle">group billing: next 0</text>
  </g>
  <g data-step="4">
    <text class="f-small f-warn" x="600" y="69" text-anchor="end">lag 7</text>
