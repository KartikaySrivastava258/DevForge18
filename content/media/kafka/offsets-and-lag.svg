<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210">
  <!-- Offsets and lag for one partition, from Consumer groups, offsets and lag. -->
  <text class="f-small f-muted" x="16" y="30">partition 0 of orders</text>
  <g>
    <rect class="f-box-accent" x="40" y="44" width="56" height="40" rx="4"/>
    <text class="f-small f-strong" x="68" y="69" text-anchor="middle">0</text>
  </g>
  <g>
    <rect class="f-box-accent" x="104" y="44" width="56" height="40" rx="4"/>
    <text class="f-small f-strong" x="132" y="69" text-anchor="middle">1</text>
  </g>
  <g>
    <rect class="f-box-accent" x="168" y="44" width="56" height="40" rx="4"/>
    <text class="f-small f-strong" x="196" y="69" text-anchor="middle">2</text>
  </g>
  <g>
    <rect class="f-box-accent" x="232" y="44" width="56" height="40" rx="4"/>
    <text class="f-small f-strong" x="260" y="69" text-anchor="middle">3</text>
  </g>
  <g>
    <rect class="f-box-accent" x="296" y="44" width="56" height="40" rx="4"/>
    <text class="f-small f-strong" x="324" y="69" text-anchor="middle">4</text>
  </g>
  <g data-step="2">
    <rect class="f-box-warn" x="360" y="44" width="56" height="40" rx="4"/>
    <text class="f-small f-strong" x="388" y="69" text-anchor="middle">5</text>
  </g>
  <g data-step="2">
    <rect class="f-box-warn" x="424" y="44" width="56" height="40" rx="4"/>
    <text class="f-small f-strong" x="452" y="69" text-anchor="middle">6</text>
  </g>
  <g data-step="1" data-until="3">
    <g>
      <path class="f-arrow-accent" d="M356 120 L356 98"/>
