    </g>
    <text class="f-small f-strong" x="356" y="138" text-anchor="middle">group billing: next 5</text>
  </g>
  <g data-step="1" data-until="1">
    <g>
      <path class="f-arrow" d="M356 170 L356 98"/>
      <polygon class="f-head" points="356,90 360.5,98 351.5,98"/>
    </g>
    <text class="f-small f-strong" x="356" y="188" text-anchor="middle">log end 5</text>
  </g>
  <g data-step="2">
    <g>
      <path class="f-arrow" d="M484 170 L484 98"/>
      <polygon class="f-head" points="484,90 488.5,98 479.5,98"/>
    </g>
    <text class="f-small f-strong" x="484" y="188" text-anchor="middle">log end 7</text>
  </g>
  <g data-step="2" data-until="2">
    <text class="f-small f-warn" x="600" y="69" text-anchor="end">lag 2</text>
  </g>
  <g data-step="3" data-until="3">
    <g>
      <path class="f-arrow-accent" d="M484 120 L484 98"/>
      <polygon class="f-head-accent" points="484,90 488.5,98 479.5,98"/>
    </g>
