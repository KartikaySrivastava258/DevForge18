<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330">
  <!-- The transactional outbox, from The outbox pattern and event-driven design. -->
  <rect class="f-box-accent" x="10" y="30" width="160" height="70" rx="8"/>
  <text class="f-small f-strong" x="90" y="58" text-anchor="middle">order service</text>
  <text class="f-small" x="90" y="80" text-anchor="middle">place order o3</text>
  <rect class="f-box-faint" x="210" y="20" width="260" height="160" rx="8"/>
  <text class="f-small f-strong" x="340" y="42" text-anchor="middle">PostgreSQL — one transaction</text>
  <rect class="f-box-ok" x="225" y="55" width="230" height="45" rx="8"/>
  <text class="f-small f-mono" x="340" y="83" text-anchor="middle">INSERT INTO orders (o3)</text>
  <rect class="f-box-ok" x="225" y="115" width="230" height="50" rx="8"/>
  <text class="f-small f-mono" x="340" y="136" text-anchor="middle">INSERT INTO outbox</text>
  <text class="f-small f-mono" x="340" y="155" text-anchor="middle">(event_id, o3, payload)</text>
  <g>
    <path class="f-arrow" d="M172 65 L200 65"/>
    <polygon class="f-head" points="208,65 200,69.5 200,60.5"/>
  </g>
  <rect class="f-box-faint" x="510" y="110" width="200" height="70" rx="8"/>
  <text class="f-small f-strong" x="610" y="136" text-anchor="middle">relay</text>
  <text class="f-small" x="610" y="158" text-anchor="middle">publish, then mark</text>
  <g>
    <path class="f-arrow" d="M457 140 L500.0 144.2"/>
    <polygon class="f-head" points="508,145 499.6,148.7 500.5,139.7"/>
  </g>
  <rect class="f-box-accent" x="510" y="220" width="200" height="50" rx="8"/>
  <text class="f-small f-mono" x="610" y="250" text-anchor="middle">Kafka: order-events</text>
  <g>
    <path class="f-arrow" d="M610 182 L610 210"/>
    <polygon class="f-head" points="610,218 605.5,210 614.5,210"/>
  </g>
  <rect class="f-box-faint" x="210" y="220" width="260" height="50" rx="8"/>
  <text class="f-small" x="340" y="241" text-anchor="middle">shipping: skip event IDs</text>
  <text class="f-small" x="340" y="260" text-anchor="middle">already handled</text>
  <g>
    <path class="f-arrow" d="M508 245 L480 245"/>
    <polygon class="f-head" points="472,245 480,240.5 480,249.5"/>
  </g>
  <text class="f-small f-danger" x="360" y="300" text-anchor="middle">dual write (commit, then publish) can lose events; the outbox cannot — it can only repeat them</text>
</svg>
