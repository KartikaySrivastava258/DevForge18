<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <!-- Schemas, IDs and compatibility, from Schemas and evolution. -->
  <rect class="f-box-accent" x="250" y="20" width="220" height="110" rx="8"/>
  <text class="f-small f-strong" x="360" y="44" text-anchor="middle">schema registry</text>
  <text class="f-small f-mono" x="360" y="68" text-anchor="middle">orders-value</text>
  <text class="f-small f-mono" x="360" y="88" text-anchor="middle">v1 → ID 1 · v2 → ID 2</text>
  <text class="f-small f-mono" x="360" y="112" text-anchor="middle">rule: BACKWARD</text>
  <rect class="f-box-faint" x="10" y="170" width="200" height="90" rx="8"/>
  <text class="f-small f-strong" x="110" y="194" text-anchor="middle">producer</text>
  <text class="f-small" x="110" y="218" text-anchor="middle">look up / register</text>
  <text class="f-small" x="110" y="240" text-anchor="middle">schema, get its ID</text>
  <rect class="f-box-faint" x="260" y="170" width="200" height="90" rx="8"/>
  <text class="f-small f-strong" x="360" y="194" text-anchor="middle">record in the topic</text>
  <text class="f-small f-mono" x="360" y="220" text-anchor="middle">00 | 00 00 00 02 | Avro</text>
  <text class="f-small" x="360" y="242" text-anchor="middle">format · ID · data</text>
  <rect class="f-box-ok" x="510" y="170" width="200" height="90" rx="8"/>
  <text class="f-small f-strong" x="610" y="194" text-anchor="middle">consumer</text>
  <text class="f-small" x="610" y="218" text-anchor="middle">fetch writer schema</text>
  <text class="f-small" x="610" y="240" text-anchor="middle">by ID, resolve to own</text>
  <g>
    <path class="f-arrow" d="M212 215 L250 215"/>
    <polygon class="f-head" points="258,215 250,219.5 250,210.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M462 215 L500 215"/>
    <polygon class="f-head" points="508,215 500,219.5 500,210.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M110 168 L110 75 L240 75"/>
    <polygon class="f-head" points="248,75 240,79.5 240,70.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M610 168 L610 75 L480 75"/>
    <polygon class="f-head" points="472,75 480,70.5 480,79.5"/>
  </g>
  <text class="f-small f-danger" x="360" y="292" text-anchor="middle">new version checked against the rule before any producer can use it: incompatible → HTTP 409</text>
</svg>
