<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290">
  <!-- From rule to notification, from Alerting rules and Alertmanager. -->
  <rect class="f-box" x="10" y="80" width="170" height="110" rx="8"/>
  <text class="f-small f-strong" x="95" y="104" text-anchor="middle">Prometheus</text>
  <text class="f-small" x="95" y="128" text-anchor="middle">alerting rules:</text>
  <text class="f-small" x="95" y="148" text-anchor="middle">what is wrong</text>
  <text class="f-small f-mono" x="95" y="170" text-anchor="middle">(expr, for, labels)</text>
  <rect class="f-box-accent" x="230" y="30" width="250" height="220" rx="8"/>
  <text class="f-small f-strong" x="355" y="54" text-anchor="middle">Alertmanager</text>
  <text class="f-small" x="355" y="82" text-anchor="middle">route by labels</text>
  <text class="f-small" x="355" y="106" text-anchor="middle">group, wait, repeat</text>
  <text class="f-small" x="355" y="134" text-anchor="middle">inhibit: ServiceDown</text>
  <text class="f-small" x="355" y="154" text-anchor="middle">mutes HighLatency</text>
  <text class="f-small" x="355" y="182" text-anchor="middle">silence: planned work</text>
  <text class="f-small f-muted" x="355" y="222" text-anchor="middle">who hears, when, how often</text>
  <rect class="f-box-danger" x="530" y="20" width="180" height="60" rx="8"/>
  <text class="f-small f-strong f-mono" x="620" y="44" text-anchor="middle">on-call</text>
  <text class="f-small f-mono" x="620" y="64" text-anchor="middle">severity=page</text>
  <rect class="f-box" x="530" y="110" width="180" height="60" rx="8"/>
  <text class="f-small f-strong f-mono" x="620" y="134" text-anchor="middle">team-tickets</text>
  <text class="f-small" x="620" y="154" text-anchor="middle">default route</text>
  <rect class="f-box-ok" x="530" y="200" width="180" height="60" rx="8"/>
  <text class="f-small f-strong f-mono" x="620" y="224" text-anchor="middle">heartbeat</text>
  <text class="f-small" x="620" y="244" text-anchor="middle">Watchdog, always firing</text>
  <g>
    <path class="f-arrow" d="M182 135 L220 135"/>
    <polygon class="f-head" points="228,135 220,139.5 220,130.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M482 80 L521.2 56.2"/>
    <polygon class="f-head" points="528,52 523.5,60.0 518.8,52.3"/>
  </g>
  <g>
    <path class="f-arrow" d="M482 140 L520 140"/>
    <polygon class="f-head" points="528,140 520,144.5 520,135.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M482 200 L521.2 223.8"/>
    <polygon class="f-head" points="528,228 518.8,227.7 523.5,220.0"/>
  </g>
</svg>
