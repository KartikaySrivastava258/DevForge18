<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220">
  <!-- Numbered diagram for the Git track quiz: label the three places a change passes through. -->
  <rect class="f-box-faint" x="20" y="60" width="180" height="90" rx="8"/>
  <text class="f-strong" x="110" y="112" text-anchor="middle">1</text>
  <rect class="f-box-faint" x="270" y="60" width="180" height="90" rx="8"/>
  <text class="f-strong" x="360" y="112" text-anchor="middle">2</text>
  <rect class="f-box-faint" x="520" y="60" width="180" height="90" rx="8"/>
  <text class="f-strong" x="610" y="112" text-anchor="middle">3</text>
  <g>
    <path class="f-arrow" d="M202 105 L260 105"/>
    <polygon class="f-head" points="268,105 260,109.5 260,100.5"/>
  </g>
  <text class="f-small f-mono" x="235" y="92" text-anchor="middle">git add</text>
  <g>
    <path class="f-arrow" d="M452 105 L510 105"/>
    <polygon class="f-head" points="518,105 510,109.5 510,100.5"/>
  </g>
  <text class="f-small f-mono" x="485" y="92" text-anchor="middle">git commit</text>
  <text class="f-small" x="360" y="190" text-anchor="middle">label boxes 1, 2 and 3</text>
</svg>
