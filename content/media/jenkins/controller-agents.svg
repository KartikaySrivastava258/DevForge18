<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262">
  <!-- Controller and agents, from Jenkins in Docker. -->
  <g data-step="1">
    <text class="f-strong" x="44" y="66" text-anchor="middle">you</text>
    <g>
      <path class="f-arrow" d="M66 62 L110 62"/>
      <polygon class="f-head" points="118,62 110,66.5 110,57.5"/>
    </g>
    <rect class="f-box" x="120" y="20" width="400" height="84" rx="8"/>
    <text class="f-strong" x="320" y="48" text-anchor="middle">Controller</text>
    <text class="f-small f-muted" x="320" y="70" text-anchor="middle">web UI · jobs · scheduling · build history</text>
    <text class="f-small f-muted" x="320" y="90" text-anchor="middle">configuration and credentials</text>
  </g>
  <g data-step="2">
    <g>
      <path class="f-arrow" d="M225 106 L225 168"/>
      <polygon class="f-head" points="225,176 220.5,168 229.5,168"/>
    </g>
    <text class="f-small f-muted" x="235" y="146">run this stage</text>
    <rect class="f-box-accent" x="150" y="178" width="150" height="62" rx="8"/>
    <text class="f-strong" x="225" y="204" text-anchor="middle">Agent A</text>
    <text class="f-small" x="225" y="224" text-anchor="middle">runs the build steps</text>
  </g>
  <g data-step="3">
    <g>
      <path class="f-arrow" d="M415 106 L415 168"/>
      <polygon class="f-head" points="415,176 410.5,168 419.5,168"/>
    </g>
    <text class="f-small f-muted" x="425" y="146">run this stage</text>
    <rect class="f-box-accent" x="340" y="178" width="150" height="62" rx="8"/>
    <text class="f-strong" x="415" y="204" text-anchor="middle">Agent B</text>
    <text class="f-small" x="415" y="224" text-anchor="middle">runs the build steps</text>
  </g>
  <text class="f-small f-muted" x="500" y="202" data-step="3">separate machines</text>
  <text class="f-small f-muted" x="500" y="218" data-step="3">or containers</text>
</svg>
