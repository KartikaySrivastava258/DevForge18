<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270">
  <!-- Controller, queue and agents, from Agents, labels and running builds in containers. -->
  <rect class="f-box-accent" x="10" y="60" width="220" height="150" rx="8"/>
  <text class="f-small f-strong" x="120" y="84" text-anchor="middle">controller</text>
  <text class="f-small" x="120" y="108" text-anchor="middle">built-in node:</text>
  <text class="f-small f-mono" x="120" y="128" text-anchor="middle">0 executors</text>
  <text class="f-small f-strong" x="120" y="156" text-anchor="middle">queue</text>
  <text class="f-small f-warn" x="120" y="178" text-anchor="middle">needs-windows: no nodes</text>
  <text class="f-small f-warn" x="120" y="196" text-anchor="middle">with the label 'windows'</text>
  <rect class="f-box-ok" x="300" y="50" width="200" height="100" rx="8"/>
  <text class="f-small f-strong" x="400" y="74" text-anchor="middle">agent-1 (container)</text>
  <text class="f-small f-mono" x="400" y="98" text-anchor="middle">label: linux</text>
  <text class="f-small" x="400" y="120" text-anchor="middle">1 executor</text>
  <text class="f-small f-mono" x="400" y="140" text-anchor="middle">runs on-agent #1</text>
  <rect class="f-box-faint" x="300" y="175" width="200" height="70" rx="8"/>
  <text class="f-small" x="400" y="199" text-anchor="middle">no agent labelled</text>
  <text class="f-small f-mono" x="400" y="221" text-anchor="middle">windows</text>
  <rect class="f-box" x="540" y="50" width="170" height="100" rx="8"/>
  <text class="f-small f-strong" x="625" y="74" text-anchor="middle">connects in:</text>
  <text class="f-small f-mono" x="625" y="98" text-anchor="middle">WebSocket on :8080</text>
  <text class="f-small" x="625" y="120" text-anchor="middle">with its secret</text>
  <g>
    <path class="f-arrow" d="M298 100 L240 100"/>
    <polygon class="f-head" points="232,100 240,95.5 240,104.5"/>
  </g>
  <text class="f-small" x="265" y="92" text-anchor="middle"></text>
  <g>
    <path class="f-arrow" d="M538 100 L510 100"/>
    <polygon class="f-head" points="502,100 510,95.5 510,104.5"/>
  </g>
  <text class="f-small f-muted" x="360" y="262" text-anchor="middle">labels route stages; disposable container or Kubernetes agents keep builds clean</text>
</svg>
