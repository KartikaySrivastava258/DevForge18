<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220">
  <!-- A pipeline with parallel stages, from Parallel stages, artefacts and test reports. -->
  <rect class="f-box-faint" x="16" y="20" width="360" height="120" rx="8"/>
  <text class="f-small f-strong" x="196" y="42" text-anchor="middle">stage Checks — parallel</text>
  <rect class="f-box" x="32" y="56" width="150" height="36" rx="8"/>
  <text class="f-small f-mono" x="107" y="79" text-anchor="middle">Notes check</text>
  <rect class="f-box" x="32" y="98" width="150" height="36" rx="8"/>
  <text class="f-small" x="107" y="121" text-anchor="middle">Tests → reports/*.xml</text>
  <text class="f-small f-muted" x="282" y="79" text-anchor="middle">executor 1</text>
  <text class="f-small f-muted" x="282" y="121" text-anchor="middle">executor 2</text>
  <rect class="f-box" x="420" y="56" width="204" height="78" rx="8"/>
  <text class="f-small f-strong" x="522" y="80" text-anchor="middle">stage Package</text>
  <text class="f-small f-mono" x="522" y="100" text-anchor="middle">archiveArtifacts</text>
  <text class="f-small f-mono" x="522" y="118" text-anchor="middle">dist/notes.tar.gz</text>
  <g>
    <path class="f-arrow" d="M378 80 L410.3 89.7"/>
    <polygon class="f-head" points="418,92 409.1,94.0 411.6,85.4"/>
  </g>
  <rect class="f-box-accent" x="16" y="160" width="608" height="44" rx="8"/>
  <text class="f-small f-mono" x="320" y="180" text-anchor="middle">post { always { junit 'reports/*.xml' } }</text>
  <text class="f-small f-muted" x="320" y="196" text-anchor="middle">test report published whatever the outcome; a failing test marks the build unstable</text>
</svg>
