<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270">
  <!-- How a Pod receives configuration, from ConfigMaps and Secrets. -->
  <rect class="f-box-accent" x="10" y="30" width="210" height="90" rx="8"/>
  <text class="f-small f-strong f-mono" x="115" y="54" text-anchor="middle">ConfigMap library-config</text>
  <text class="f-small f-mono" x="115" y="78" text-anchor="middle">GREETING</text>
  <text class="f-small" x="115" y="100" text-anchor="middle">settings.ini (a whole file)</text>
  <rect class="f-box-warn" x="10" y="150" width="210" height="90" rx="8"/>
  <text class="f-small f-strong f-mono" x="115" y="174" text-anchor="middle">Secret db-credentials</text>
  <text class="f-small f-mono" x="115" y="198" text-anchor="middle">password (base64)</text>
  <text class="f-small f-danger" x="115" y="220" text-anchor="middle">unencrypted in etcd by default</text>
  <rect class="f-box" x="300" y="50" width="400" height="170" rx="8"/>
  <text class="f-small f-strong f-mono" x="500" y="74" text-anchor="middle">Pod library-app</text>
  <rect class="f-box-faint" x="320" y="90" width="170" height="110" rx="8"/>
  <text class="f-small f-strong" x="405" y="112" text-anchor="middle">environment</text>
  <text class="f-small f-mono" x="405" y="136" text-anchor="middle">GREETING</text>
  <text class="f-small f-mono" x="405" y="154" text-anchor="middle">DB_PASSWORD</text>
  <text class="f-small" x="405" y="176" text-anchor="middle">set at start:</text>
  <text class="f-small f-warn" x="405" y="194" text-anchor="middle">new Pod to update</text>
  <rect class="f-box-faint" x="510" y="90" width="170" height="110" rx="8"/>
  <text class="f-small f-strong" x="595" y="112" text-anchor="middle">mounted files</text>
  <text class="f-small f-mono" x="595" y="136" text-anchor="middle">/etc/library</text>
  <text class="f-small f-mono" x="595" y="154" text-anchor="middle">/etc/secrets</text>
  <text class="f-small" x="595" y="176" text-anchor="middle">refreshed by kubelet</text>
  <text class="f-small f-ok" x="595" y="194" text-anchor="middle">after a delay</text>
  <g>
    <path class="f-arrow" d="M222 75 L310.8 116.6"/>
    <polygon class="f-head" points="318,120 308.8,120.7 312.7,112.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M222 195 L310.5 162.7"/>
    <polygon class="f-head" points="318,160 312.0,167.0 308.9,158.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M222 90 L500.0 109.4"/>
    <polygon class="f-head" points="508,110 499.7,113.9 500.3,105.0"/>
  </g>
</svg>
