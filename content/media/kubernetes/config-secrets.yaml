alt: 'A ConfigMap named library-config holds GREETING and a whole file, settings.ini. A Secret named db-credentials holds a base64-encoded password and is stored unencrypted in etcd by default. Pod library-app receives GREETING and DB_PASSWORD as environment variables, which are set when the container starts, so a new Pod is needed to see changes. It also mounts files at /etc/library and /etc/secrets, which the kubelet refreshes after a delay.'
caption: 'Environment variables are fixed at start; mounted files follow changes; Secrets are only as safe as access to them.'
