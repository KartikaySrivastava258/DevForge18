<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290">
  <!-- From outside to a Service, from How traffic enters a cluster. -->
  <rect class="f-box" x="10" y="110" width="110" height="60" rx="8"/>
  <text class="f-small f-strong" x="65" y="136" text-anchor="middle">client</text>
  <text class="f-small f-muted" x="65" y="156" text-anchor="middle">outside</text>
  <rect class="f-box-faint" x="160" y="20" width="170" height="66" rx="8"/>
  <text class="f-small f-strong f-mono" x="245" y="44" text-anchor="middle">GatewayClass</text>
  <text class="f-small" x="245" y="66" text-anchor="middle">infrastructure provider</text>
  <rect class="f-box-accent" x="160" y="106" width="170" height="70" rx="8"/>
  <text class="f-small f-strong f-mono" x="245" y="130" text-anchor="middle">Gateway campus</text>
  <text class="f-small f-mono" x="245" y="152" text-anchor="middle">listener :80</text>
  <text class="f-small f-muted" x="245" y="168" text-anchor="middle">cluster operator</text>
