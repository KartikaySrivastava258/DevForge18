  <text class="f-small f-strong f-mono" x="645" y="84" text-anchor="middle">library</text>
  <text class="f-small" x="645" y="104" text-anchor="middle">/library or header</text>
  <rect class="f-box-ok" x="580" y="160" width="130" height="56" rx="8"/>
  <text class="f-small f-strong f-mono" x="645" y="184" text-anchor="middle">timetable</text>
  <text class="f-small" x="645" y="204" text-anchor="middle">everything else</text>
  <g>
