<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240">
  <!-- A module called twice and a moved block, from Modules, reuse and safe refactoring. -->
  <rect class="f-box-faint" x="16" y="20" width="190" height="200" rx="8"/>
  <text class="f-small f-strong" x="111" y="42" text-anchor="middle">root module (main.tf)</text>
  <rect class="f-box" x="32" y="56" width="158" height="44" rx="8"/>
  <text class="f-small f-mono" x="111" y="76" text-anchor="middle">module "cs101"</text>
  <text class="f-small f-muted" x="111" y="92" text-anchor="middle">code CS101, 30 students</text>
  <rect class="f-box" x="32" y="112" width="158" height="44" rx="8"/>
  <text class="f-small f-mono" x="111" y="132" text-anchor="middle">module "db201"</text>
  <text class="f-small f-muted" x="111" y="148" text-anchor="middle">code DB201, 25 students</text>
  <rect class="f-box-accent" x="32" y="168" width="158" height="40" rx="8"/>
  <text class="f-small" x="111" y="186" text-anchor="middle">moved block: the old</text>
  <text class="f-small" x="111" y="200" text-anchor="middle">address → module.cs101</text>
  <rect class="f-box" x="260" y="56" width="160" height="100" rx="8"/>
  <text class="f-small f-strong f-mono" x="340" y="78" text-anchor="middle">modules/course</text>
  <text class="f-small f-muted" x="340" y="98" text-anchor="middle">inputs: code, students</text>
  <text class="f-small f-mono" x="340" y="116" text-anchor="middle">resource local_file</text>
  <text class="f-small f-mono" x="340" y="132" text-anchor="middle">"roster"</text>
  <text class="f-small f-muted" x="340" y="148" text-anchor="middle">output: file</text>
  <g>
    <path class="f-arrow" d="M192 78 L250.2 90.3"/>
    <polygon class="f-head" points="258,92 249.2,94.7 251.1,86.0"/>
  </g>
  <g>
    <path class="f-arrow" d="M192 134 L250.2 121.7"/>
    <polygon class="f-head" points="258,120 251.1,126.0 249.2,117.3"/>
  </g>
  <rect class="f-box-ok" x="470" y="56" width="154" height="40" rx="8"/>
  <text class="f-small f-mono" x="547" y="81" text-anchor="middle">rosters/cs101.txt</text>
  <rect class="f-box-ok" x="470" y="112" width="154" height="40" rx="8"/>
  <text class="f-small f-mono" x="547" y="137" text-anchor="middle">rosters/db201.txt</text>
  <g>
    <path class="f-arrow" d="M422 92 L460.4 78.6"/>
    <polygon class="f-head" points="468,76 461.9,82.9 459.0,74.4"/>
  </g>
  <g>
    <path class="f-arrow" d="M422 120 L460.3 130.0"/>
    <polygon class="f-head" points="468,132 459.1,134.3 461.4,125.6"/>
  </g>
  <text class="f-small f-muted" x="547" y="186" text-anchor="middle">same file, new address:</text>
  <text class="f-small f-ok" x="547" y="202" text-anchor="middle">0 to destroy</text>
</svg>
