<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260">
  <!-- Shared state with a lock, from Remote state, locking and workspaces. -->
  <rect class="f-box" x="10" y="30" width="170" height="64" rx="8"/>
  <text class="f-small f-strong" x="95" y="55" text-anchor="middle">engineer: apply</text>
  <text class="f-small f-ok" x="95" y="76" text-anchor="middle">holds the lock</text>
  <rect class="f-box" x="10" y="160" width="170" height="64" rx="8"/>
  <text class="f-small f-strong" x="95" y="185" text-anchor="middle">CI job: apply</text>
  <text class="f-small f-warn" x="95" y="206" text-anchor="middle">waits or fails: locked</text>
  <rect class="f-box-accent" x="250" y="60" width="230" height="140" rx="8"/>
  <text class="f-small f-strong f-mono" x="365" y="86" text-anchor="middle">backend "pg"</text>
  <text class="f-small f-mono" x="365" y="112" text-anchor="middle">terraform_remote_state</text>
  <text class="f-small" x="365" y="136" text-anchor="middle">table states: one row</text>
  <text class="f-small" x="365" y="156" text-anchor="middle">per workspace</text>
  <text class="f-small f-muted" x="365" y="182" text-anchor="middle">advisory lock per run</text>
  <rect class="f-box-ok" x="540" y="40" width="170" height="56" rx="8"/>
  <text class="f-small f-strong f-mono" x="625" y="63" text-anchor="middle">default</text>
  <text class="f-small f-mono" x="625" y="82" text-anchor="middle">out/default.txt</text>
  <rect class="f-box-ok" x="540" y="160" width="170" height="56" rx="8"/>
  <text class="f-small f-strong f-mono" x="625" y="183" text-anchor="middle">staging</text>
  <text class="f-small f-mono" x="625" y="202" text-anchor="middle">out/staging.txt</text>
