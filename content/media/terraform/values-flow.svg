<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290">
  <!-- How values flow, from Variables, validation, outputs and state. -->
  <rect class="f-box" x="16" y="16" width="170" height="48" rx="8"/>
  <text class="f-mono" x="101" y="45" text-anchor="middle">variables.tf</text>
  <text class="f-mono" x="206" y="36">var.course_code, var.student_count</text>
  <text class="f-small f-muted" x="206" y="54">typed, validated, with defaults</text>
  <g>
    <path class="f-arrow" d="M101 66 L101 76"/>
    <polygon class="f-head" points="101,84 96.5,76 105.5,76"/>
  </g>
  <rect class="f-box-accent" x="16" y="86" width="170" height="48" rx="8"/>
  <text class="f-mono" x="101" y="115" text-anchor="middle">main.tf</text>
  <text class="f-mono" x="206" y="106">resource "local_file" "summary"</text>
  <text class="f-small f-muted" x="206" y="124">filename uses var.course_code</text>
  <g>
    <path class="f-arrow" d="M101 136 L101 146"/>
    <polygon class="f-head" points="101,154 96.5,146 105.5,146"/>
  </g>
  <rect class="f-box" x="16" y="156" width="170" height="48" rx="8"/>
  <text class="f-mono" x="101" y="185" text-anchor="middle">terraform.tfstate</text>
  <text class="f-small" x="206" y="176">every attribute of every managed resource</text>
  <text class="f-small f-muted" x="206" y="194">recorded by apply</text>
  <g>
    <path class="f-arrow" d="M101 206 L101 216"/>
    <polygon class="f-head" points="101,224 96.5,216 105.5,216"/>
  </g>
  <rect class="f-box-ok" x="16" y="226" width="170" height="48" rx="8"/>
  <text class="f-mono" x="101" y="255" text-anchor="middle">outputs</text>
  <text class="f-mono" x="206" y="246">summary_file = "./cs101.txt"</text>
  <text class="f-small f-muted" x="206" y="264">values reported after apply</text>
  <text class="f-small f-muted" x="111" y="151">terraform apply</text>
</svg>
