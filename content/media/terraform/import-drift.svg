  <text class="f-small f-strong" x="105" y="106" text-anchor="middle">configuration</text>
  <text class="f-small f-mono" x="105" y="130" text-anchor="middle">docker_network</text>
  <text class="f-small f-mono" x="105" y="152" text-anchor="middle">"legacy"</text>
  <rect class="f-box" x="265" y="80" width="190" height="100" rx="8"/>
