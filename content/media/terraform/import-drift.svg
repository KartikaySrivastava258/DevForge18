  <text class="f-small f-mono" x="360" y="130" text-anchor="middle">docker_network.legacy</text>
  <text class="f-small" x="360" y="152" text-anchor="middle">id = network ID</text>
  <rect class="f-box-ok" x="520" y="80" width="190" height="100" rx="8"/>
  <text class="f-small f-strong" x="615" y="106" text-anchor="middle">real network</text>
