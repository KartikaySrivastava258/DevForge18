<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330">
  <!-- Timeouts, retries and callbacks, from Timeouts and failure callbacks. -->
  <text class="f-small f-strong" x="360" y="24" text-anchor="middle">task export: execution_timeout = 3 s, retries = 1</text>
  <rect class="f-box-danger" x="10" y="40" width="180" height="60" rx="8"/>
  <text class="f-small f-mono" x="100" y="64" text-anchor="middle">try 1: 3 s</text>
  <text class="f-small f-mono" x="100" y="86" text-anchor="middle">AirflowTaskTimeout</text>
  <g>
    <path class="f-arrow" d="M192 70 L230 70"/>
    <polygon class="f-head" points="238,70 230,74.5 230,65.5"/>
  </g>
  <text class="f-small" x="215" y="58" text-anchor="middle">retry</text>
  <rect class="f-box-danger" x="240" y="40" width="180" height="60" rx="8"/>
  <text class="f-small f-mono" x="330" y="64" text-anchor="middle">try 2: 3 s</text>
  <text class="f-small f-mono" x="330" y="86" text-anchor="middle">AirflowTaskTimeout</text>
  <g>
    <path class="f-arrow" d="M422 70 L460 70"/>
    <polygon class="f-head" points="468,70 460,74.5 460,65.5"/>
  </g>
  <rect class="f-box-accent" x="470" y="40" width="240" height="60" rx="8"/>
  <text class="f-small f-mono" x="590" y="64" text-anchor="middle">on_retry_callback (try 1)</text>
  <text class="f-small f-mono" x="590" y="86" text-anchor="middle">on_failure_callback (try 2)</text>
  <text class="f-small f-strong" x="360" y="136" text-anchor="middle">task validate: retries = 3, raises AirflowFailException</text>
  <rect class="f-box-danger" x="10" y="150" width="180" height="50" rx="8"/>
  <text class="f-small f-mono" x="100" y="180" text-anchor="middle">try 1: fails</text>
  <g>
    <path class="f-arrow" d="M192 175 L460 175"/>
    <polygon class="f-head" points="468,175 460,179.5 460,170.5"/>
  </g>
  <text class="f-small" x="330" y="166" text-anchor="middle">no retries used</text>
  <rect class="f-box-accent" x="470" y="150" width="240" height="50" rx="8"/>
  <text class="f-small f-mono" x="590" y="180" text-anchor="middle">on_failure_callback</text>
  <text class="f-small f-strong" x="360" y="236" text-anchor="middle">DAG slow_report: dagrun_timeout = 10 s</text>
  <rect class="f-box-faint" x="10" y="250" width="410" height="50" rx="8"/>
  <text class="f-small" x="215" y="280" text-anchor="middle">run failed at 10 s · running task build → skipped</text>
  <g>
    <path class="f-arrow" d="M422 275 L460 275"/>
    <polygon class="f-head" points="468,275 460,279.5 460,270.5"/>
  </g>
  <rect class="f-box-accent" x="470" y="250" width="240" height="50" rx="8"/>
  <text class="f-small f-mono" x="590" y="274" text-anchor="middle">DAG on_failure_callback</text>
  <text class="f-small f-mono" x="590" y="292" text-anchor="middle">reason = timed_out</text>
</svg>
