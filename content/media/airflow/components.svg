<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330">
  <!-- Airflow 3's components, from Deployment and executors. -->
  <rect class="f-box-accent" x="270" y="130" width="180" height="60" rx="8"/>
  <text class="f-small f-strong" x="360" y="156" text-anchor="middle">metadata database</text>
  <text class="f-small" x="360" y="176" text-anchor="middle">PostgreSQL</text>
  <rect class="f-box-faint" x="10" y="20" width="200" height="60" rx="8"/>
  <text class="f-small f-strong" x="110" y="46" text-anchor="middle">API server</text>
  <text class="f-small" x="110" y="66" text-anchor="middle">REST API · UI · execution API</text>
  <rect class="f-box-faint" x="260" y="20" width="200" height="60" rx="8"/>
  <text class="f-small f-strong" x="360" y="46" text-anchor="middle">DAG processor</text>
  <text class="f-small" x="360" y="66" text-anchor="middle">parses DAG files</text>
  <rect class="f-box-faint" x="510" y="20" width="200" height="60" rx="8"/>
  <text class="f-small f-strong" x="610" y="46" text-anchor="middle">triggerer</text>
  <text class="f-small" x="610" y="66" text-anchor="middle">deferred tasks</text>
  <rect class="f-box-ok" x="10" y="240" width="260" height="70" rx="8"/>
  <text class="f-small f-strong" x="140" y="264" text-anchor="middle">scheduler + executor</text>
  <text class="f-small" x="140" y="286" text-anchor="middle">creates runs, queues tasks</text>
  <rect class="f-box-faint" x="330" y="240" width="380" height="70" rx="8"/>
  <text class="f-small f-strong" x="520" y="262" text-anchor="middle">where tasks run (executor):</text>
  <text class="f-small" x="520" y="284" text-anchor="middle">Local: processes beside the scheduler (parallelism)</text>
  <text class="f-small" x="520" y="302" text-anchor="middle">Celery: queue + workers · Kubernetes: a pod per task</text>
  <g>
    <path class="f-arrow" d="M110 82 L292.2 126.1"/>
    <polygon class="f-head" points="300,128 291.2,130.5 293.3,121.7"/>
  </g>
  <g>
    <path class="f-arrow" d="M360 82 L360 120"/>
    <polygon class="f-head" points="360,128 355.5,120 364.5,120"/>
  </g>
  <g>
    <path class="f-arrow" d="M610 82 L427.8 126.1"/>
    <polygon class="f-head" points="420,128 426.7,121.7 428.8,130.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M140 238 L292.3 194.2"/>
    <polygon class="f-head" points="300,192 293.6,198.5 291.1,189.9"/>
  </g>
  <g>
    <path class="f-arrow" d="M272 275 L320 275"/>
    <polygon class="f-head" points="328,275 320,279.5 320,270.5"/>
  </g>
</svg>
