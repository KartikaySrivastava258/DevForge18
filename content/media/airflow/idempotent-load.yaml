alt: 'Three runs for 2 January 2026, each with ds 2026-01-02: the first run, a re-run, and a re-run after the source file was corrected. The append load, using INSERT, holds 3 rows and revenue 669 after the first run, 6 rows and 1338 after the re-run, and 8 rows and 1897 after the corrected re-run. The load that replaces the day holds 3 rows and 669, then 3 rows and 669, then 2 rows and 559, matching the corrected source. Deleting the day and inserting in one transaction gives the same result for the same input every time.'
caption: 'An append load drifts with every re-run; replacing the day''s partition stays correct.'
