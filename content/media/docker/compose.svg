<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260">
  <!-- A two-service Compose project, from Networks and Docker Compose. -->
  <rect class="f-box" x="10" y="95" width="120" height="64" rx="8"/>
  <text class="f-small f-strong" x="70" y="120" text-anchor="middle">curl</text>
  <text class="f-small f-mono" x="70" y="140" text-anchor="middle">127.0.0.1:8096</text>
  <rect class="f-box-faint" x="170" y="20" width="400" height="200" rx="8"/>
  <text class="f-small f-strong f-mono" x="370" y="42" text-anchor="middle">network devforge-lab_default</text>
  <rect class="f-box-accent" x="190" y="80" width="160" height="90" rx="8"/>
  <text class="f-small f-strong" x="270" y="104" text-anchor="middle">api</text>
  <text class="f-small f-mono" x="270" y="126" text-anchor="middle">node:22-alpine</text>
  <text class="f-small f-mono" x="270" y="148" text-anchor="middle">REDIS_HOST=cache</text>
  <rect class="f-box-ok" x="400" y="80" width="150" height="90" rx="8"/>
  <text class="f-small f-strong" x="475" y="104" text-anchor="middle">cache</text>
