  <text class="f-small" x="475" y="148" text-anchor="middle">ping health check</text>
  <text class="f-small f-muted" x="375" y="200" text-anchor="middle">api starts only after cache is healthy</text>
  <rect class="f-box-warn" x="600" y="95" width="110" height="64" rx="8"/>
  <text class="f-small f-strong" x="655" y="120" text-anchor="middle">volume</text>
  <text class="f-small f-mono" x="655" y="140" text-anchor="middle">cache-data</text>
  <g>
