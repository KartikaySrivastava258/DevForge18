alt: 'A webhook receives the request; the next node answers the requester at once with 202 and the execution''s resume URL; a Wait node pauses until the URL is called or its time limit runs out; a Decide step applies the rules in code. There are three endings: approved or declined by someone other than the requester; refused because the approver is the requester; or escalated because nobody answered in time. While waiting, the execution is stored in n8n''s database, so it survives a restart as long as the database is kept on a volume.'
caption: 'Wait with a limit, decide with rules in code, and keep waiting executions in a durable database.'
