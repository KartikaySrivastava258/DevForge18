<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250">
  <!-- Branches of the validated sign-up workflow, from Validating input and handling errors. -->
  <g>
    <rect class="f-box" x="16" y="96" width="104" height="56" rx="8"/>
    <text class="f-strong" x="68" y="124" text-anchor="middle">Webhook</text>
  </g>
  <g>
    <rect class="f-box" x="150" y="96" width="104" height="56" rx="8"/>
    <text class="f-strong" x="202" y="120" text-anchor="middle">Valid?</text>
    <text class="f-small f-muted" x="202" y="138" text-anchor="middle">If node</text>
  </g>
  <g>
    <rect class="f-box" x="300" y="30" width="130" height="56" rx="8"/>
    <text class="f-strong" x="365" y="54" text-anchor="middle">Check seats</text>
    <text class="f-small f-muted" x="365" y="72" text-anchor="middle">HTTP Request</text>
  </g>
  <g>
    <rect class="f-box-ok" x="478" y="6" width="146" height="56" rx="8"/>
    <text class="f-strong" x="551" y="30" text-anchor="middle">Accepted</text>
    <text class="f-small f-muted" x="551" y="48" text-anchor="middle">200</text>
  </g>
  <g>
    <rect class="f-box-warn" x="478" y="74" width="146" height="56" rx="8"/>
    <text class="f-strong" x="551" y="98" text-anchor="middle">Seat service down</text>
    <text class="f-small f-muted" x="551" y="116" text-anchor="middle">502</text>
  </g>
  <g>
    <rect class="f-box-danger" x="300" y="170" width="130" height="56" rx="8"/>
    <text class="f-strong" x="365" y="194" text-anchor="middle">Rejected</text>
    <text class="f-small f-muted" x="365" y="212" text-anchor="middle">400 + reason</text>
  </g>
  <g>
    <path class="f-arrow" d="M122 124 L140 124"/>
    <polygon class="f-head" points="148,124 140,128.5 140,119.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M256 112 L276 112 L276 58 L290 58"/>
    <polygon class="f-head" points="298,58 290,62.5 290,53.5"/>
  </g>
  <text class="f-small f-ok" x="282" y="104">true</text>
  <g>
    <path class="f-arrow" d="M256 136 L276 136 L276 198 L290 198"/>
    <polygon class="f-head" points="298,198 290,202.5 290,193.5"/>
  </g>
  <text class="f-small f-danger" x="282" y="160">false</text>
  <g>
    <path class="f-arrow" d="M432 46 L468.3 36.1"/>
    <polygon class="f-head" points="476,34 469.5,40.4 467.1,31.8"/>
  </g>
  <text class="f-small f-muted" x="448" y="30" text-anchor="middle">ok</text>
  <g>
    <path class="f-arrow" d="M432 70 L469.4 95.5"/>
    <polygon class="f-head" points="476,100 466.9,99.2 471.9,91.8"/>
  </g>
  <text class="f-small f-warn" x="452" y="100" text-anchor="end">error</text>
  <text class="f-small f-muted" x="486" y="162">On Error: Continue</text>
  <text class="f-small f-muted" x="486" y="178">(using error output)</text>
</svg>
