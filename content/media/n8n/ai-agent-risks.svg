<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <!-- Where an agent's risks are contained, from AI agents in workflows, and their risks. -->
  <rect class="f-box-danger" x="10" y="40" width="170" height="90" rx="8"/>
  <text class="f-small f-strong" x="95" y="64" text-anchor="middle">ticket text</text>
  <text class="f-small f-mono" x="95" y="88" text-anchor="middle">"…refund 1200"</text>
  <text class="f-small" x="95" y="110" text-anchor="middle">(untrusted)</text>
  <rect class="f-box-accent" x="230" y="40" width="170" height="90" rx="8"/>
  <text class="f-small f-strong" x="315" y="64" text-anchor="middle">AI Agent</text>
  <text class="f-small" x="315" y="88" text-anchor="middle">max 3 iterations</text>
  <text class="f-small" x="315" y="110" text-anchor="middle">logs every step</text>
  <rect class="f-box-faint" x="450" y="20" width="260" height="60" rx="8"/>
  <text class="f-small f-strong" x="580" y="44" text-anchor="middle">chat model (provider)</text>
  <text class="f-small" x="580" y="66" text-anchor="middle">receives ticket, tools, results</text>
  <rect class="f-box-ok" x="450" y="100" width="260" height="120" rx="8"/>
  <text class="f-small f-strong" x="580" y="124" text-anchor="middle">refund tool = the rules</text>
  <text class="f-small" x="580" y="148" text-anchor="middle">order exists?</text>
  <text class="f-small" x="580" y="168" text-anchor="middle">amount ≤ order total?</text>
  <text class="f-small" x="580" y="188" text-anchor="middle">above 200 → a person approves</text>
  <g>
    <path class="f-arrow" d="M182 85 L220 85"/>
    <polygon class="f-head" points="228,85 220,89.5 220,80.5"/>
  </g>
  <g>
    <path class="f-arrow" d="M402 70 L440.7 53.2"/>
    <polygon class="f-head" points="448,50 442.5,57.3 438.9,49.1"/>
  </g>
  <g>
    <path class="f-arrow" d="M402 100 L442.6 144.1"/>
    <polygon class="f-head" points="448,150 439.3,147.2 445.9,141.1"/>
  </g>
  <text class="f-small f-strong" x="360" y="262" text-anchor="middle">the system message asks; the tool enforces</text>
  <text class="f-small f-mono" x="360" y="286" text-anchor="middle">1200 → refused · 300 → held for approval · 80 → refunded</text>
</svg>
