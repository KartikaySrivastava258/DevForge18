<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <!-- How a join follows foreign keys, from Relationships, joins and grouping. -->
  <g>
    <text class="f-mono" x="16" y="32">students</text>
    <rect class="f-box" x="16" y="40" width="130" height="78" rx="4"/>
    <rect class="f-box-faint" x="16" y="40" width="130" height="26" rx="4"/>
    <text class="f-small f-strong" x="38" y="58" text-anchor="end">id</text>
    <text class="f-mono" x="38" y="84" text-anchor="end">1</text>
    <text class="f-mono" x="38" y="110" text-anchor="end">2</text>
    <line class="f-line" x1="46" y1="40" x2="46" y2="118"/>
    <text class="f-small f-strong" x="54" y="58">name</text>
    <text class="f-mono" x="54" y="84">Asha Rao</text>
    <text class="f-mono" x="54" y="110">Ravi Kumar</text>
    <line class="f-line" x1="16" y1="66" x2="146" y2="66"/>
    <line class="f-line" x1="16" y1="92" x2="146" y2="92"/>
  </g>
  <g>
    <text class="f-mono" x="184" y="32">enrolments</text>
    <rect class="f-box" x="184" y="40" width="174" height="104" rx="4"/>
    <rect class="f-box-faint" x="184" y="40" width="174" height="26" rx="4"/>
    <text class="f-small f-strong" x="258" y="58" text-anchor="end">student_id</text>
    <text class="f-mono" x="258" y="84" text-anchor="end">1</text>
    <text class="f-mono" x="258" y="110" text-anchor="end">1</text>
    <text class="f-mono" x="258" y="136" text-anchor="end">2</text>
    <line class="f-line" x1="266" y1="40" x2="266" y2="144"/>
    <text class="f-small f-strong" x="274" y="58">course_code</text>
    <text class="f-mono" x="274" y="84">CS101</text>
    <text class="f-mono" x="274" y="110">DB201</text>
    <text class="f-mono" x="274" y="136">DB201</text>
    <line class="f-line" x1="184" y1="66" x2="358" y2="66"/>
    <line class="f-line" x1="184" y1="92" x2="358" y2="92"/>
    <line class="f-line" x1="184" y1="118" x2="358" y2="118"/>
  </g>
  <g>
    <text class="f-mono" x="400" y="32">courses</text>
    <rect class="f-box" x="400" y="40" width="220" height="78" rx="4"/>
    <rect class="f-box-faint" x="400" y="40" width="220" height="26" rx="4"/>
    <text class="f-small f-strong" x="408" y="58">code</text>
    <text class="f-mono" x="408" y="84">CS101</text>
    <text class="f-mono" x="408" y="110">DB201</text>
    <line class="f-line" x1="462" y1="40" x2="462" y2="118"/>
    <text class="f-small f-strong" x="470" y="58">title</text>
    <text class="f-mono" x="470" y="84">Programming Basics</text>
    <text class="f-mono" x="470" y="110">Database Systems</text>
    <line class="f-line" x1="400" y1="66" x2="620" y2="66"/>
    <line class="f-line" x1="400" y1="92" x2="620" y2="92"/>
  </g>
  <text class="f-small f-muted" x="271" y="162" text-anchor="middle">PRIMARY KEY (student_id, course_code)</text>
  <g data-step="2">
    <g>
      <path class="f-arrow-accent" d="M182 79 L156 79"/>
      <polygon class="f-head-accent" points="148,79 156,74.5 156,83.5"/>
    </g>
    <g>
      <path class="f-arrow-accent" d="M182 105 L154.4 83.9"/>
      <polygon class="f-head-accent" points="148,79 157.1,80.3 151.6,87.4"/>
    </g>
    <g>
      <path class="f-arrow-accent" d="M182 131 L154.4 109.9"/>
      <polygon class="f-head-accent" points="148,105 157.1,106.3 151.6,113.4"/>
    </g>
    <text class="f-small f-accent" x="16" y="132">foreign key → students.id</text>
  </g>
  <g data-step="3">
    <g>
      <path class="f-arrow-accent" d="M360 79 L390 79"/>
      <polygon class="f-head-accent" points="398,79 390,83.5 390,74.5"/>
    </g>
    <g>
      <path class="f-arrow-accent" d="M360 105 L390 105"/>
      <polygon class="f-head-accent" points="398,105 390,109.5 390,100.5"/>
    </g>
    <g>
      <path class="f-arrow-accent" d="M360 131 L391.4 109.5"/>
      <polygon class="f-head-accent" points="398,105 393.9,113.2 388.9,105.8"/>
    </g>
    <text class="f-small f-accent" x="400" y="132">foreign key → courses.code</text>
  </g>
  <g data-step="4">
    <text class="f-small f-strong" x="196" y="192">JOIN result (for the rows shown)</text>
    <g>
      <rect class="f-box" x="196" y="202" width="280" height="88" rx="4"/>
      <rect class="f-box-faint" x="196" y="202" width="280" height="22" rx="4"/>
      <text class="f-small f-strong" x="204" y="220">name</text>
      <text class="f-mono" x="204" y="242">Asha Rao</text>
      <text class="f-mono" x="204" y="264">Asha Rao</text>
      <text class="f-mono" x="204" y="286">Ravi Kumar</text>
      <line class="f-line" x1="316" y1="202" x2="316" y2="290"/>
      <text class="f-small f-strong" x="324" y="220">title</text>
      <text class="f-mono" x="324" y="242">Database Systems</text>
      <text class="f-mono" x="324" y="264">Programming Basics</text>
      <text class="f-mono" x="324" y="286">Database Systems</text>
      <line class="f-line" x1="196" y1="224" x2="476" y2="224"/>
      <line class="f-line" x1="196" y1="246" x2="476" y2="246"/>
      <line class="f-line" x1="196" y1="268" x2="476" y2="268"/>
    </g>
  </g>
</svg>
