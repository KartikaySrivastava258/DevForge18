<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236">
  <!-- A table and its constraints, from Tables, rows and constraints. -->
  <g>
    <text class="f-mono" x="24" y="32">table: students</text>
    <rect class="f-box" x="24" y="40" width="418" height="78" rx="4"/>
    <rect class="f-box-faint" x="24" y="40" width="418" height="26" rx="4"/>
    <text class="f-small f-strong" x="60" y="58" text-anchor="end">id</text>
    <text class="f-mono" x="60" y="84" text-anchor="end">1</text>
    <text class="f-mono" x="60" y="110" text-anchor="end">2</text>
    <line class="f-line" x1="68" y1="40" x2="68" y2="118"/>
    <text class="f-small f-strong" x="76" y="58">name</text>
    <text class="f-mono" x="76" y="84">Asha Rao</text>
    <text class="f-mono" x="76" y="110">Ravi Kumar</text>
    <line class="f-line" x1="186" y1="40" x2="186" y2="118"/>
    <text class="f-small f-strong" x="194" y="58">email</text>
    <text class="f-mono" x="194" y="84">asha@example.edu</text>
    <text class="f-mono" x="194" y="110">ravi@example.edu</text>
    <line class="f-line" x1="346" y1="40" x2="346" y2="118"/>
    <text class="f-small f-strong" x="434" y="58" text-anchor="end">study_year</text>
    <text class="f-mono" x="434" y="84" text-anchor="end">2</text>
    <text class="f-mono" x="434" y="110" text-anchor="end">3</text>
    <line class="f-line" x1="24" y1="66" x2="442" y2="66"/>
    <line class="f-line" x1="24" y1="92" x2="442" y2="92"/>
  </g>
  <text class="f-small f-muted" x="452" y="58">← columns: name and type</text>
  <text class="f-small f-muted" x="452" y="84">← one row per student</text>
  <g>
    <path class="f-arrow" d="M46 176 L46 130"/>
    <polygon class="f-head" points="46,122 50.5,130 41.5,130"/>
  </g>
  <text class="f-small f-strong" x="46" y="196" text-anchor="middle">PRIMARY KEY</text>
  <text class="f-small f-muted" x="46" y="214" text-anchor="middle">identifies a row</text>
  <g>
    <path class="f-arrow" d="M266 176 L266 130"/>
    <polygon class="f-head" points="266,122 270.5,130 261.5,130"/>
  </g>
  <text class="f-small f-strong" x="266" y="196" text-anchor="middle">UNIQUE</text>
  <text class="f-small f-muted" x="266" y="214" text-anchor="middle">no duplicates</text>
  <g>
    <path class="f-arrow" d="M394 176 L394 130"/>
    <polygon class="f-head" points="394,122 398.5,130 389.5,130"/>
  </g>
  <text class="f-small f-strong" x="394" y="196" text-anchor="middle">CHECK (1 to 4)</text>
  <text class="f-small f-muted" x="394" y="214" text-anchor="middle">allowed values</text>
</svg>
