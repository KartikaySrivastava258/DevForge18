slug: airflow
number: 16
title: Workflow Orchestration
short_title: Apache Airflow
category: data-messaging
products:
  - name: Apache Airflow
    role: Platform to programmatically author, schedule and monitor workflows defined as Python DAGs.
mental_model: Airflow schedules and monitors workflows made of dependent tasks, especially data pipelines.
outcome: Schedule, retry and monitor data workflows using DAGs.
summary: >-
  In Airflow you write workflows as Python code: a DAG (directed acyclic graph) of tasks with
  dependencies, such as extract → transform → load → report. The scheduler creates runs according to
  a schedule or trigger, an executor hands tasks to workers, and the web UI shows each run's status,
  logs and retries.
problem: >-
  Cron jobs and hand-written scripts cannot express dependencies between steps, retry failures
  sensibly, backfill missed periods or show clearly what ran and what failed. Airflow makes batch
  workflows explicit, observable and recoverable.
not_this: >-
  Airflow is not a streaming engine or a message broker — it orchestrates batch tasks and is not a
  substitute for Kafka. XCom is meant for small values such as IDs or file paths, not for passing
  large datasets between tasks; tasks should exchange references to data stored elsewhere.
architecture_position: >-
  Airflow sits in the data and ML platform layer, orchestrating batch jobs that read from sources
  such as PostgreSQL or files produced from event streams, transform data and load results into
  analytical stores.
entry_level: intermediate
estimated_hours: { min: 12, max: 18 }
skills_needed:
  - Python programming
  - Basic SQL
prerequisites: [postgresql]
related:
  - slug: kafka
    why: Airflow can schedule batch processing of data that arrived as streams; streaming itself stays in Kafka.
  - slug: mlflow
    why: Airflow can orchestrate repeatable training runs that record experiments in MLflow.
  - slug: n8n
    why: Both automate workflows, but for different users, workloads and operational models.
