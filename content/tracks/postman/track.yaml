slug: postman
number: 13
title: API Development & Testing
short_title: Postman
category: apis-automation
products:
  - name: Postman
    role: API platform for sending requests, organising collections, writing tests, mocking and documenting APIs.
  - name: Postman CLI and Newman
    role: Command-line runners that execute Postman collections, for example as a step in a CI pipeline.
mental_model: Postman lets developers send API requests, inspect responses, organise collections and automate API tests.
outcome: Design, inspect, test, document and automate API workflows.
summary: >-
  Postman lets you build an HTTP request — method, URL, headers, query parameters and body — send it,
  and inspect the exact response, status code, headers and timing. Requests are saved into
  collections, values such as base URLs and tokens live in environment variables, and short
  JavaScript test scripts assert that responses are correct.
problem: >-
  Testing APIs with ad-hoc commands is hard to repeat and share, and manual checks are easily
  skipped. Collections make an API's behaviour explorable and documented, and the same tests can run
  automatically in CI.
not_this: >-
  Postman is not the API itself, and it does not replace automated tests inside the codebase. It is
  also not a safe place for production credentials: collections and environments can be synced and
  shared, so secrets must be handled deliberately.
architecture_position: >-
  Postman sits beside the API layer as a client and test harness used during development,
  documentation and CI, exercising backend services through the same HTTP interface real clients use.
entry_level: beginner
estimated_hours: { min: 6, max: 10 }
skills_needed:
  - A basic idea of what a web API is
prerequisites: []
related:
  - slug: github-actions
    why: Collection runs can execute in CI as automated API regression tests.
  - slug: n8n
    why: The APIs you explore and test in Postman are the same APIs n8n workflows call.
  - slug: nginx
    why: Testing through the reverse proxy reveals routing, header and timeout problems that direct calls miss.
