slug: n8n
number: 17
title: Workflow & AI Automation
short_title: n8n
category: apis-automation
products:
  - name: n8n
    role: Workflow-automation tool, self-hosted or managed, that connects apps and APIs through visual node-based workflows with optional code.
mental_model: n8n connects applications and APIs through visual workflows, while allowing code when needed.
outcome: Connect applications and automate business processes.
summary: >-
  An n8n workflow starts with a trigger — a webhook call, a schedule or an event in another app — and
  passes data through a chain of nodes that call APIs, transform data, branch on conditions or wait
  for a human to approve. You build workflows visually and can drop into code nodes when the
  built-in nodes are not enough.
problem: >-
  Many business processes — form submissions, notifications, ticket routing — are glue between
  existing services. Writing, hosting and monitoring custom code for each one is slow; an automation
  tool lets teams build and observe these integrations quickly.
not_this: >-
  n8n is not a replacement for a well-tested backend service or for large-scale data-pipeline
  orchestration (Airflow's domain). It is distributed under n8n's "fair-code" Sustainable Use
  License rather than an OSI-approved open-source licence, so check the terms before building a
  commercial product on it.
architecture_position: >-
  n8n sits in the integration layer, reacting to webhooks and schedules and calling the APIs of
  internal services and SaaS products — often the same APIs explored and tested with Postman.
entry_level: beginner
estimated_hours: { min: 8, max: 12 }
skills_needed:
  - Sending HTTP requests and reading JSON responses
prerequisites: [postman]
related:
  - slug: postman
    why: APIs tested in Postman become the building blocks that n8n workflows call.
  - slug: airflow
    why: Comparing them clarifies business-process automation versus scheduled data pipelines.
  - slug: postgresql
    why: Workflows often validate input and record results or audit trails in a database.
