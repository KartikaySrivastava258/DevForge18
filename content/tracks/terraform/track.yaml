slug: terraform
number: 5
title: Infrastructure as Code
short_title: Terraform
category: containers-infra
products:
  - name: Terraform
    role: HashiCorp's infrastructure-as-code tool that plans and applies infrastructure changes through provider plugins.
mental_model: Terraform describes the infrastructure you want; it calculates and applies changes to reach that desired state.
outcome: Provision repeatable infrastructure declaratively.
summary: >-
  With Terraform you write configuration files in HCL that describe the infrastructure you want —
  networks, servers, databases, DNS records. Terraform compares that description with what it has
  recorded in its state and with the real world, shows you a plan of exactly what it will create,
  change or destroy, and applies it only when you approve.
problem: >-
  Creating infrastructure by clicking through web consoles is slow, error-prone and impossible to
  review or reproduce. Infrastructure as Code makes environments versioned, reviewable in pull
  requests and repeatable.
not_this: >-
  Terraform is not a configuration-management tool for installing software inside servers (tools
  such as Ansible fill that role), and it is not an application-release tool. Its state file is
  critical and can contain sensitive values, so it must be stored and protected deliberately.
architecture_position: >-
  Terraform works at the foundation layer, provisioning what everything else runs on — clusters,
  databases, networks and DNS — usually from a reviewed pull request and a CI pipeline.
entry_level: intermediate
estimated_hours: { min: 12, max: 18 }
skills_needed:
  - Running commands in a terminal
  - Committing and pushing with Git
prerequisites: [git-github]
related:
  - slug: kubernetes
    why: Terraform can create clusters and supporting resources that Kubernetes workloads depend on.
  - slug: github-actions
    why: CI commonly runs terraform fmt, validate and plan on pull requests so changes are reviewed first.
