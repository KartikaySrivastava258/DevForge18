slug: git-github
number: 1
title: Version Control & Collaboration
short_title: Git + GitHub
category: source-planning
products:
  - name: Git
    role: Distributed version-control system that records snapshots of a project's files and their full history on your own machine.
  - name: GitHub
    role: Hosting platform for Git repositories that adds pull requests, code review, issues, releases, permissions and automation.
mental_model: Git is a time machine for a codebase; GitHub is a collaboration platform built around repositories and Git workflows.
outcome: Track changes, branch, review and collaborate on code.
summary: >-
  Git keeps the history of a project as a series of snapshots called commits, so you can see
  what changed, when, why and by whom — and go back when something breaks. Every clone holds
  the complete history, so people can work on their own branches, even offline, and merge
  their work later. GitHub hosts Git repositories and adds the collaboration layer teams rely
  on: pull requests, reviews, issues, releases and access control.
problem: >-
  Without version control, teams email zip files, overwrite each other's work and cannot
  reliably answer "what changed, and why?". Git makes every change traceable and reversible,
  and GitHub gives a team one place to propose, review and discuss changes before they are merged.
not_this: >-
  Git is not GitHub. Git is the version-control tool that runs on your machine; GitHub is one of
  several hosting services for Git repositories (GitLab and Bitbucket are others). Neither is a
  backup system for large binary files, and neither is a safe place to store secrets.
architecture_position: >-
  Repositories are the source of truth for code, configuration and infrastructure definitions.
  Almost every other track starts here: CI systems react to repository events, pipelines and
  infrastructure are defined as files in repositories, and work items link to branches and pull requests.
entry_level: beginner
