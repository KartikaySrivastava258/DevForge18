slug: opentelemetry
number: 15
title: Observability
short_title: OpenTelemetry
category: observability
products:
  - name: OpenTelemetry
    role: Vendor-neutral, open-source APIs, SDKs and Collector for generating, processing and exporting traces, metrics and logs.
mental_model: OpenTelemetry provides common ways to generate, collect and export telemetry so engineers can understand what happens inside distributed applications.
outcome: Instrument traces, metrics and logs across services.
summary: >-
  OpenTelemetry (OTel) is a CNCF project that standardises how applications produce telemetry. You
  add its SDK — or automatic instrumentation — to a service, and it records traces (trees of timed
  spans showing how one request moved through services) alongside metrics and logs. The Collector
  receives that data, processes it, and exports it to whichever backends you choose.
problem: >-
  In a distributed system one user request may touch many services, and without correlated
  telemetry it is very hard to find which hop was slow or failed. Before a common standard, each
  monitoring vendor needed its own instrumentation, which locked teams in.
not_this: >-
  OpenTelemetry is not a storage or dashboard backend: it produces and transports telemetry, while
  tools such as Prometheus, Jaeger or Grafana store and visualise it. It does not replace
  Prometheus — the two are complementary.
architecture_position: >-
  OpenTelemetry is the instrumentation and transport layer of observability: SDKs inside services
  emit telemetry, the Collector pipelines it, and backends store and analyse it.
entry_level: intermediate
estimated_hours: { min: 12, max: 18 }
skills_needed:
