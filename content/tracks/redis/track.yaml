slug: redis
number: 9
title: Caching & Fast Data
short_title: Redis
category: data-messaging
products:
  - name: Redis
    role: In-memory data store offering strings, hashes, lists, sets, sorted sets and streams, with optional persistence.
mental_model: Redis keeps frequently needed data in memory so applications can retrieve or update it quickly.
outcome: Reduce latency, manage ephemeral state and coordinate work.
summary: >-
  Redis holds data in memory, so individual operations are very fast. Instead of tables it offers
  data structures — strings, hashes, lists, sets, sorted sets and streams — manipulated with atomic
  commands. That makes it a common choice for caches, sessions, counters, rate limiters,
  leaderboards and lightweight queues shared between many application instances.
problem: >-
  Repeatedly reading the same data from a disk-based database or a slow external API wastes time and
  capacity. Redis serves hot data from memory and offers atomic operations for shared state that
  several application instances must coordinate on.
not_this: >-
  Redis is not a drop-in replacement for a relational database: memory is limited and costly, and
  depending on persistence settings the most recent writes can be lost after a crash. A cache holds a
  copy of data, so every cache needs an expiry and invalidation plan.
architecture_position: >-
  Redis sits beside backend services, usually in front of a primary database such as PostgreSQL,
  holding cached results, sessions and rate-limit counters that must be fast and shared between instances.
entry_level: beginner
estimated_hours: { min: 10, max: 14 }
skills_needed:
  - Running commands in a terminal
  - Basic programming in any language
prerequisites: []
related:
