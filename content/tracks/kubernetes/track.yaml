slug: kubernetes
number: 3
title: Container Orchestration
short_title: Kubernetes
category: containers-infra
products:
  - name: Kubernetes
    role: Open-source system that schedules and manages containerised workloads across a cluster of machines.
  - name: kubectl
    role: Command-line client used to inspect and change objects through the Kubernetes API.
mental_model: Kubernetes is a control system that keeps the desired number of application containers running across a cluster.
outcome: Deploy, scale and recover containerised services.
summary: >-
  Kubernetes runs containers across a group of machines called a cluster and keeps them in the state
  you declare. You describe what you want — for example three replicas of an API reachable through a
  stable Service — and controllers continuously compare that desired state with what is actually
  running, replacing failed Pods and rolling out new versions gradually.
problem: >-
  Running containers by hand on several servers does not scale: someone must restart crashed
  processes, spread load, upgrade without downtime and send traffic only to healthy instances.
  Kubernetes automates these operations behind a declarative API.
not_this: >-
  Kubernetes is not a container runtime or an image builder, and it is not required for every
  project — for a small application a single server or Docker Compose is often simpler and cheaper to
  operate. It also does not make an application scalable by itself; the application has to be
  designed to run as several interchangeable instances.
architecture_position: >-
  Kubernetes is the runtime platform layer. It runs images built in CI, exposes them through
  Services and Ingress or Gateway controllers, and exposes workload and cluster metrics to monitoring
  systems such as Prometheus.
entry_level: intermediate
estimated_hours: { min: 20, max: 30 }
skills_needed:
  - Building and running Docker containers
  - Reading and writing YAML
prerequisites: [docker]
related:
  - slug: docker
    why: Kubernetes deploys the container images that Docker (or another builder) produces.
  - slug: prometheus-grafana
    why: Prometheus is widely used to scrape metrics from cluster components and workloads.
  - slug: terraform
    why: Terraform can provision clusters and the cloud resources around them declaratively.
