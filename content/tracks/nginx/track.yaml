slug: nginx
number: 14
title: Web Traffic & Reverse Proxy
short_title: Nginx
category: containers-infra
products:
  - name: Nginx
    role: High-performance web server and reverse proxy that serves static files, routes requests, terminates TLS and load-balances.
mental_model: Nginx sits in front of applications and handles incoming web traffic efficiently.
outcome: Route requests, serve static assets, terminate TLS and load balance.
summary: >-
  Nginx accepts incoming HTTP connections and decides what to do with each request based on its
  configuration: serve a file from disk, forward ("proxy") the request to an application server,
  spread traffic across several backend instances, or reject it. Its event-driven design lets one
  server handle many concurrent connections with modest memory.
problem: >-
  Exposing application servers directly to the internet means each one must handle TLS, slow
  clients, static files, compression and abuse protection. A reverse proxy centralises those
  concerns in front of the applications.
not_this: >-
  Nginx is not an application server for business logic, and adding it does not automatically make
  a system secure or fast — misconfigured headers, timeouts or caching rules can cause outages and
  even leak private data between users.
architecture_position: >-
  Nginx sits at the edge, between clients and backend services: it terminates TLS, serves static
  frontend assets and routes API requests to the right service instances.
entry_level: beginner
estimated_hours: { min: 8, max: 12 }
skills_needed:
