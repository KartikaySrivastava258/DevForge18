# Licences as stated by each project where it was read; "not stated" means it was not checked.
checked_on: '2026-11-28'
alternatives:
- name: Haystack
  category: LLM framework
  url: https://haystack.deepset.ai/
  licence: Apache-2.0
  licence_source: https://github.com/deepset-ai/haystack/blob/main/LICENSE
  choose_when: You are building retrieval/search-centred pipelines and like explicit, composable pipeline components.
  avoid_when: You depend on integrations or community examples that exist mainly for LangChain or LlamaIndex.
- name: Semantic Kernel
  category: LLM SDK
  url: https://learn.microsoft.com/en-us/semantic-kernel/
  licence: MIT
  licence_source: https://github.com/microsoft/semantic-kernel/blob/main/LICENSE
  choose_when: Your team works in C#/.NET (it also has Python/Java) or is heavily invested in Microsoft/Azure.
  avoid_when: You are Python-first and want the broadest set of community retrieval integrations.
- name: DSPy
  category: prompt programming
  url: https://dspy.ai/
  licence: MIT
  licence_source: https://github.com/stanfordnlp/dspy/blob/main/LICENSE
  choose_when: You want to optimise prompts and pipelines systematically against an evaluation metric instead of
    hand-tuning prompts.
  avoid_when: You need a quick prototype or lack a labelled evaluation set; its value depends on having a metric
    to optimise.
- name: Direct use of model SDKs (e.g. OpenAI Python SDK, Anthropic Python SDK)
  category: provider SDK
  url: https://github.com/openai/openai-python
  licence: Apache-2.0 (both SDKs)
  licence_source: https://github.com/openai/openai-python/blob/main/LICENSE
  choose_when: The application is small or well understood, and you want fewer dependencies, full control and easier
    debugging.
  avoid_when: You need many ready-made connectors, retrievers or agent patterns, or must switch between providers
    often.
# Vector stores are used together with LangChain or LlamaIndex, not instead of them: a separate choice, so a separate list.
complements:
  title: Where to store the vectors
  intro: >-
    The lessons in this track keep vectors in memory. A real application keeps them in a vector store, which
    LangChain or LlamaIndex then queries — a choice made separately from the framework. Each entry was read on the
    project's own site or repository.
  items:
  - name: pgvector
    category: vector store
    url: https://github.com/pgvector/pgvector
    licence: Permissive, PostgreSQL-style notice (not named in the repository)
    licence_source: https://github.com/pgvector/pgvector/blob/master/LICENSE
    choose_when: You already run PostgreSQL and want vectors next to your relational data, with transactions and SQL
      filters.
    avoid_when: You need a dedicated vector service with features or scaling behaviour beyond what your PostgreSQL
      setup provides.
    note: GitHub does not recognise the licence by name; read the LICENSE file before relying on it.
  - name: Qdrant
    category: vector database
    url: https://qdrant.tech/
    licence: Apache-2.0
    licence_source: https://github.com/qdrant/qdrant/blob/master/LICENSE
    choose_when: You want a dedicated vector database written in Rust and run as a server, with filtering on payload
      fields during the search itself and dense and sparse vectors for hybrid (semantic plus lexical) retrieval —
      self-hosted as open source or as a managed cloud.
    avoid_when: Your vectors sit next to relational data you already keep in PostgreSQL and pgvector is enough, or a
      prototype is simpler with an in-process store than with another server to run.
    note: The README's quick start (docker run -p 6333:6333 qdrant/qdrant) starts a deployment without
      authentication; configure security before exposing it.
  - name: Weaviate
    category: vector database
    url: https://weaviate.io/
    licence: BSD-3-Clause outside the repository's "wl" directory; code in "wl" only under a separate enterprise licence
    licence_source: https://github.com/weaviate/weaviate/blob/main/LICENSE
    choose_when: You want an open-source vector database that stores data objects together with their embeddings and
      combines semantic and keyword search, run with Docker for development, on Kubernetes for production, or in
      Weaviate Cloud.
    avoid_when: You would rely on features in the enterprise-licensed part without a commercial agreement, or a small
      project is simpler with pgvector or an in-process store.
    note: The LICENSE file says enterprise features are enabled via a licence key and the BSD licence does not grant
      the right to use them; GitHub shows the repository's licence as "Other". Read it before relying on a feature.
  - name: Chroma
    category: vector database
    url: https://www.trychroma.com/
    licence: Apache-2.0
    licence_source: https://github.com/chroma-core/chroma/blob/main/LICENSE
    choose_when: You start in Python and want no server at first — the Python client can run Chroma in memory or save
      it to a local folder (PersistentClient) — and later move the same SDK to a self-hosted server or Chroma Cloud.
    avoid_when: Your application is written in JavaScript/TypeScript or Rust and you wanted the in-process mode (those
      clients connect to a running Chroma server), or you already run PostgreSQL and pgvector is enough.
