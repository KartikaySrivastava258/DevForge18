slug: langchain-llamaindex
number: 8
title: LLM Application Frameworks
short_title: LangChain + LlamaIndex
category: ai-ml
products:
  - name: LangChain
    role: Open-source framework for composing LLM applications from model integrations, prompts, retrievers, tools and agent workflows.
  - name: LlamaIndex
    role: Open-source data framework focused on ingesting, indexing and retrieving your own data for LLM applications such as RAG.
mental_model: These frameworks help developers connect language models to data, tools and application workflows. They do not replace the model itself.
outcome: Build grounded LLM applications, retrieval and tool workflows.
summary: >-
  LangChain and LlamaIndex are Python and TypeScript libraries that sit between your application and
  a large language model. They provide building blocks for common patterns: loading documents,
  splitting them into chunks, turning chunks into embeddings, storing them in a vector index,
  retrieving relevant passages for a question and sending them to the model with a prompt — or
  letting the model request calls to tools that you define and control.
problem: >-
  Calling a model API directly is simple, but real LLM features need retrieval over your own data,
  structured outputs, tool calls, retries, evaluation and cost control. These frameworks package
  common patterns and integrations so teams do not rebuild them for every project.
not_this: >-
  Neither framework is a language model — they orchestrate calls to models hosted by a provider or
  run locally. They do not make answers correct: grounding, evaluation and permission checks remain
  the engineer's job. They overlap, but LlamaIndex centres on data ingestion and retrieval, while
  LangChain centres on composing model, tool and agent workflows.
architecture_position: >-
  The frameworks live inside an application service. They read permitted documents from storage,
  write and query embeddings in a vector store (which can be PostgreSQL with pgvector), call a model
  provider, and return grounded answers with citations to the user interface.
entry_level: intermediate
estimated_hours: { min: 18, max: 25 }
skills_needed:
  - Python programming (functions, packages, virtual environments)
  - Calling HTTP APIs and handling JSON
prerequisites: []
related:
  - slug: postgresql
    why: PostgreSQL with the pgvector extension can serve as the vector store for retrieval.
  - slug: redis
    why: Caching repeated model responses or embeddings can reduce latency and token cost.
  - slug: opentelemetry
    why: Tracing each retrieval and model call shows where latency and failures come from.
