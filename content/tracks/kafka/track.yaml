slug: kafka
number: 10
title: Event Streaming
short_title: Apache Kafka
category: data-messaging
products:
  - name: Apache Kafka
    role: Distributed event-streaming platform that stores ordered, replicated logs of records (topics) for producers and consumers.
mental_model: Kafka is a distributed event-streaming platform that lets systems publish, retain and consume event records independently.
outcome: Build event-driven systems and reliable asynchronous pipelines.
summary: >-
  Kafka stores streams of events — "order placed", "payment failed", "student enrolled" — in topics.
  Each topic is split into partitions: append-only logs replicated across brokers. Producers append
  records, and consumers read at their own pace by tracking an offset, so several independent
  services can process the same events, and a new consumer can replay history that is still within
  the retention period.
problem: >-
  When services call each other directly, one slow or failed service blocks the others, and adding a
  new consumer of the same data means changing the producer. Kafka decouples producers from
  consumers and retains events so systems can process them independently and recover after failures.
not_this: >-
  Kafka is not a database for ad-hoc queries, not a job scheduler, and not always the best message
  queue — per-message routing, priorities and simple task queues are often better served by a
  traditional broker. Ordering is guaranteed only within a partition, and running Kafka well takes
  real operational effort.
architecture_position: >-
  Kafka is the asynchronous backbone between services: backend services publish domain events, and
  downstream consumers such as notification services, analytics pipelines and search indexers
  subscribe independently.
entry_level: intermediate
