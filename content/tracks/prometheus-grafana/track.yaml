slug: prometheus-grafana
number: 7
title: Monitoring & Metrics
short_title: Prometheus + Grafana
category: observability
products:
  - name: Prometheus
    role: Open-source monitoring system that scrapes metrics from targets, stores them as time series and evaluates alerting rules.
  - name: Grafana
    role: Visualisation platform that queries data sources such as Prometheus to build dashboards and alerts.
mental_model: Prometheus collects time-series measurements; Grafana turns measurements into dashboards and useful visual insight.
outcome: Collect metrics, create dashboards and alert on symptoms.
summary: >-
  Prometheus regularly pulls ("scrapes") numeric measurements from applications and exporters over
  HTTP — request counts, error counts, latency buckets, memory use — and stores each labelled series
  over time. You query that data with PromQL. Grafana connects to Prometheus and other data sources
  and turns those queries into dashboards that show whether a system is healthy.
problem: >-
  Without metrics, teams learn about outages from users and cannot tell whether a change made
  things faster or slower. Metrics give a continuous numeric view of system health that drives
  dashboards and alerts.
not_this: >-
  Prometheus is not a log store or a long-term data warehouse, and it is not intended for data that
  must be 100% accurate per event, such as billing. Grafana does not collect data itself; it
  visualises data stored elsewhere.
architecture_position: >-
  Together they form the monitoring layer: services and infrastructure expose metrics, Prometheus
  scrapes and stores them, Alertmanager routes alerts, and Grafana presents dashboards to engineers.
entry_level: intermediate
estimated_hours: { min: 12, max: 18 }
skills_needed:
  - Running containers with Docker
  - Basic understanding of HTTP requests and status codes
prerequisites: [docker]
related:
  - slug: kubernetes
    why: Prometheus is commonly deployed to scrape Kubernetes components and workloads.
  - slug: opentelemetry
    why: Complementary, not interchangeable — OpenTelemetry standardises producing telemetry; Prometheus stores and queries metrics.
