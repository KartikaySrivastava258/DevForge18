slug: jenkins
number: 11
title: CI/CD Automation
short_title: Jenkins
category: ci-cd
products:
  - name: Jenkins
    role: Open-source, self-hosted automation server with a large plugin ecosystem and Pipeline-as-Code via Jenkinsfiles.
mental_model: Jenkins is an automation server that runs repeatable build, test and delivery pipelines.
outcome: Build extensible pipeline automation and understand Jenkins operations.
summary: >-
  Jenkins is a server you install and operate yourself. A controller schedules work and stores
  configuration, and agents — other machines or containers — run the actual build steps. Pipelines
  are usually written as a Jenkinsfile kept in the repository, describing stages such as build,
  test and deploy, with post actions for success and failure.
problem: >-
  Organisations need repeatable build, test and release automation that can run on their own
  infrastructure, reach private networks and adapt to unusual toolchains. Jenkins provides a
  self-managed automation server with extensive integrations.
not_this: >-
  Jenkins is not a hosted service: you are responsible for upgrades, plugin security, backups and
  agent capacity. It is not inherently better or worse than GitHub Actions — the right choice
  depends on hosting requirements, existing investment and operational capacity.
architecture_position: >-
  Jenkins sits in the delivery layer next to source control: repository webhooks trigger pipelines
  that build and test code, publish artefacts or container images, and hand off to deployment environments.
entry_level: intermediate
estimated_hours: { min: 10, max: 14 }
skills_needed:
  - Branching and pushing with Git
  - Running containers with Docker is helpful
prerequisites: [git-github]
related:
  - slug: git-github
    why: Repository webhooks trigger Jenkins pipelines, and the Jenkinsfile lives in the repository.
  - slug: github-actions
    why: Comparing both tools shows when a hosted service or a self-managed server fits better.
  - slug: docker
    why: Docker-based agents give each build a clean, reproducible environment.
