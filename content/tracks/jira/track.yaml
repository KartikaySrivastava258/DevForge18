slug: jira
number: 12
title: Agile Project Management
short_title: Jira
category: source-planning
products:
  - name: Jira
    role: Atlassian's work-tracking product for planning and reporting on issues, backlogs, boards and sprints.
mental_model: Jira helps teams organise work, track progress and make delivery visible.
outcome: Plan work, manage backlogs, sprints, bugs and delivery.
summary: >-
  Jira organises a team's work into issues — stories, tasks, bugs and epics — that move through a
  workflow such as To Do → In Progress → Done. Teams plan from a backlog, commit to time-boxed
  sprints (Scrum) or manage a continuous flow of work (Kanban), and use reports to see what is
  blocked and how long work actually takes.
problem: >-
  Without shared work tracking, teams lose track of who is doing what, priorities live in chat
  threads and nobody can tell whether a release is on schedule. A work-tracking tool makes scope,
  ownership and progress visible.
not_this: >-
  Jira is not agile by itself — it supports whatever process a team configures, good or bad. It is
  not a documentation system or a code host, though it can link to both. Atlassian updates Jira's
  interface and terminology regularly, so check current documentation for exact menus.
architecture_position: >-
  Jira sits in the planning layer of the engineering workflow rather than in the runtime
  architecture: work items link to branches, commits, pull requests and deployments so the path
  from requirement to release is traceable.
