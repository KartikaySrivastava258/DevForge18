slug: mlflow
number: 18
title: MLOps & Experiment Tracking
short_title: MLflow
category: ai-ml
products:
  - name: MLflow
    role: Open-source platform for tracking ML experiments, packaging models and managing them in a model registry.
mental_model: MLflow helps machine-learning teams record experiments, package models and manage the path from experimentation to deployment.
outcome: Track experiments, package models and manage model lifecycle.
summary: >-
  When you train a model, MLflow records each run's parameters, metrics, code version and output
  files (artifacts), so you can compare experiments instead of relying on memory or spreadsheets.
  Models are logged in a standard format, registered under a name with numbered versions, and loaded
  back later for evaluation or serving.
problem: >-
  Machine-learning work involves many experiments with different data, code and hyperparameters;
  without tracking, results cannot be reproduced and nobody is sure which model is in production.
  MLflow provides a shared record and a managed lifecycle for models.
not_this: >-
  MLflow does not train models or pick hyperparameters for you, and it is not a workflow scheduler —
  tools such as Airflow run the pipelines that call it. Its Model Registry workflow has changed
  between versions (registry stages were deprecated in favour of aliases), so always check the
  documentation for the version you install.
architecture_position: >-
  MLflow sits in the MLOps layer: training jobs log to a tracking server backed by a database such
  as PostgreSQL and artifact storage, and deployment pipelines pull registered model versions to serve them.
entry_level: intermediate
estimated_hours: { min: 10, max: 15 }
skills_needed:
  - Python programming
  - Basic machine learning (train/test split, evaluation metrics)
prerequisites: []
related:
  - slug: airflow
    why: Airflow can orchestrate repeatable training pipelines that log runs to MLflow.
  - slug: postgresql
    why: A PostgreSQL database can serve as the tracking server's backend store.
  - slug: docker
    why: Packaging a trained model and its environment as an image makes serving reproducible.
