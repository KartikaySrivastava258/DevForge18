slug: docker
number: 2
title: Containerisation
short_title: Docker
category: containers-infra
products:
  - name: Docker Engine
    role: Builds images and runs containers on a host through a background daemon and the docker CLI.
  - name: Docker Compose
    role: Defines and runs multi-container applications (for example an API plus its database) from one YAML file.
mental_model: Docker packages an application with the dependencies it needs so it behaves consistently across environments.
outcome: Package and run reproducible applications.
summary: >-
  Docker packages an application together with its runtime, libraries and configuration into an
  image. Running an image creates a container — an isolated process on the host that gets its own
  view of the filesystem, network and process list. Because the same image runs on a laptop, in CI
  and on a server, "it works on my machine" becomes "it works wherever the image runs".
problem: >-
  Applications break when moved between machines because of different operating-system packages,
  language versions or configuration. Docker captures those dependencies in a versioned image, so
  development, testing and production run the same artefact.
not_this: >-
  A container is not a virtual machine. Containers share the host's kernel instead of booting their
  own operating system, so they start quickly but isolate less strongly than a VM. (On macOS and
  Windows, Docker Desktop runs Linux containers inside a lightweight VM.) Docker is also not an
  orchestrator: scheduling containers across many machines is Kubernetes' job.
architecture_position: >-
  Docker sits between your code and the environment that runs it. CI pipelines build images,
  registries store them, and Docker Compose or Kubernetes run them alongside databases, caches and proxies.
